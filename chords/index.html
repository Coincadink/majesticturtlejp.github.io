<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chords</title>
<style>
  :root{
    --bg:#f4f2ee;
    --ink:28,27,25;
    --slotw:80px;
    --fs:44px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:rgb(var(--ink));
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
  }

  .app{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(6px,1.6vw,26px);
    width:calc(100% - var(--mode-reserve, 220px));
    margin-left:0;
  }

  .piano-indicator{
    position:fixed;
    top:env(safe-area-inset-top, 0px);
    left:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
    transform:translateX(-50%);
    color:rgba(var(--ink),.42);
    pointer-events:none;
    z-index:25;
    opacity:.79;
    transition:transform .38s cubic-bezier(.2,.8,.3,1);
  }
  .piano-indicator.collapsed{transform:translate(-50%,-100%);}
  .piano-caption{
    order:1;
    min-height:1em;
    font-size:11px;
    font-weight:350;
    line-height:1;
    letter-spacing:.025em;
    opacity:.72;
  }
  .piano-keys{order:0;display:block;width:196px;height:88px;overflow:visible;}
  .piano-white{
    fill:rgba(var(--ink),.025);
    stroke:rgba(var(--ink),.32);
    stroke-width:1;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .piano-black{
    fill:rgba(var(--ink),.68);
    stroke:rgba(var(--ink),.68);
    stroke-width:1;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .piano-sketch{
    fill:none;
    stroke:rgba(var(--ink),.16);
    stroke-width:.65;
    stroke-linecap:round;
  }
  .piano-white.selected{fill:rgba(var(--ink),.32);}
  .piano-black.selected{fill:rgba(var(--ink),.42);stroke:rgba(var(--ink),.5);}
  .piano-white.root{fill:rgb(var(--ink));}
  .piano-black.root{fill:#8a704d;stroke:#8a704d;}
  .piano-toggle{
    position:fixed;
    top:calc(102px + env(safe-area-inset-top, 0px));
    left:50%;
    display:grid;
    place-items:center;
    width:24px;
    height:20px;
    padding:0;
    border:0;
    background:none;
    color:rgba(var(--ink),.42);
    opacity:.79;
    cursor:pointer;
    z-index:26;
    transform:translateX(-50%);
    transition:top .38s cubic-bezier(.2,.8,.3,1),
      left .38s cubic-bezier(.2,.8,.3,1), color .2s ease, opacity .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .piano-toggle:hover,.piano-toggle:focus-visible{color:rgb(var(--ink));opacity:1;}
  .piano-toggle:focus{outline:none;}
  .piano-toggle:focus-visible{outline:1px solid rgba(var(--ink),.4);outline-offset:1px;}
  .piano-toggle svg{
    width:12px;
    height:8px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:transform .38s cubic-bezier(.2,.8,.3,1);
  }
  .piano-toggle svg{transform:rotate(180deg);}
  .piano-toggle.collapsed{
    top:calc(4px + env(safe-area-inset-top, 0px));
    left:50%;
  }
  .piano-toggle.collapsed svg{transform:rotate(0);}
  @media (prefers-reduced-motion:reduce){
    .piano-indicator,.piano-toggle,.piano-toggle svg{transition-duration:.01ms;}
  }
  .inversion-indicator{
    position:fixed;
    top:50%;
    right:calc(12px + var(--mode-radius, 100px));
    transform:translateY(-50%);
    color:rgba(var(--ink),.72);
    font-size:13px;
    font-weight:300;
    text-align:center;
    opacity:0;
    pointer-events:none;
    z-index:28;
    transition:opacity .22s ease;
  }
  .inversion-indicator.visible{opacity:1;}
  .inversion-options{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .inversion-label{font-size:9px;font-weight:450;letter-spacing:.08em;opacity:.62;}
  .inversion-option{line-height:1;opacity:.55;transition:opacity .15s ease,font-weight .15s ease;}
  .inversion-option.selected{font-weight:700;opacity:1;}
  @media (prefers-reduced-motion:reduce){
    .inversion-indicator{transition-duration:.01ms;}
  }

  .mode-wheel{
    position:fixed;
    top:50%;
    left:12px;
    width:calc(var(--mode-radius, 100px) + 110px);
    height:calc(var(--mode-radius, 100px) * 2);
    transform:translateY(-50%);
    z-index:30;
    touch-action:none;
    user-select:none;-webkit-user-select:none;
    cursor:grab;
  }
  .mode-wheel.dragging{cursor:grabbing;}
  .mode-arc{
    position:absolute;
    inset:0 auto 0 0;
    width:var(--mode-radius, 100px);
    height:100%;
    overflow:visible;
    pointer-events:none;
  }
  .mode-arc path{
    fill:none;
    stroke:rgba(var(--ink),.12);
    stroke-width:1;
  }
  .mode-choice{
    position:absolute;
    width:100px;
    min-height:28px;
    padding:4px 5px;
    transform:translate(-50%,-50%);
    border:0;
    border-radius:2px;
    background:var(--bg);
    color:rgb(var(--ink));
    font:inherit;
    font-size:clamp(10px,1.2vw,14px);
    font-weight:300;
    white-space:nowrap;
    opacity:.42;
    cursor:pointer;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
    transition:transform .22s cubic-bezier(.2,.8,.3,1), opacity .2s ease, font-weight .2s ease;
  }
  .mode-wheel:not(.ready) .mode-choice{visibility:hidden;}
  .mode-choice:hover,.mode-choice:focus-visible{opacity:.82;}
  .mode-choice:focus{outline:none;}
  .mode-choice:focus-visible{outline:1px solid rgba(var(--ink),.35);}
  .mode-choice.active{opacity:1;font-weight:450;}
  .mode-choice.hidden-neighbor{
    opacity:0;
    pointer-events:none;
    visibility:hidden;
    transition:transform .22s cubic-bezier(.2,.8,.3,1), opacity .2s ease, visibility 0s linear .2s;
  }
  .mode-picker{
    position:fixed;
    top:50%;
    left:50%;
    width:min(760px, calc(100vw - 32px));
    max-height:90vh;
    overflow-y:auto;
    padding:clamp(18px, 3vw, 32px);
    border:1px solid rgba(var(--ink),.15);
    background:var(--bg);
    box-shadow:0 12px 40px rgba(var(--ink),.16);
    transform:translate(-50%,-50%);
    z-index:32;
  }
  .mode-picker-close{
    position:absolute;
    top:8px;
    right:8px;
    display:grid;
    place-items:center;
    width:30px;
    min-height:30px !important;
    padding:0 !important;
    border:0 !important;
    background:transparent !important;
    font-size:21px !important;
    font-weight:300;
    line-height:1;
    opacity:.55;
  }
  .mode-picker-close:hover,.mode-picker-apply:hover{opacity:1;}
  .mode-picker-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.42);
    z-index:31;
  }
  .mode-picker-backdrop[hidden]{display:none;}
  .mode-picker[hidden]{display:none;}
  .mode-picker h2{font-size:clamp(18px,2vw,24px);font-weight:450;}
  .mode-picker-title-row{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .mode-picker-title-row h2{margin:0;}
  .mode-picker p{margin-top:8px;font-size:13px;line-height:1.5;opacity:.62;}
  .mode-family-picker{
    display:grid;
    grid-template-columns:124px minmax(0,1fr);
    align-items:center;
    gap:16px;
    margin-top:4px;
  }
  .mode-cardinality-selector{
    display:grid;
    grid-template-columns:28px minmax(0,1fr) 28px;
    align-items:center;
    justify-items:center;
    margin-top:10px;
  }
  .mode-picker .mode-cardinality-selector button{
    display:grid;
    place-items:center;
    width:28px;
    min-height:38px;
    padding:0;
    border:0;
    background:transparent;
    font-size:20px;
    opacity:.55;
  }
  .mode-picker .mode-cardinality-selector button:hover{opacity:1;}
  .mode-picker .mode-cardinality-selector button:disabled{
    cursor:default;
    opacity:.18;
  }
  .mode-picker .mode-cardinality-selector button:focus-visible,
  .mode-picker .mode-set-arrows button:focus-visible{
    outline:none;
    opacity:1;
  }
  .mode-cardinality-value{
    font-size:clamp(34px,5vw,52px);
    font-weight:300;
    font-variant-numeric:tabular-nums;
    line-height:1;
    text-align:center;
  }
  .mode-cardinality-caption{
    grid-column:1 / -1;
    margin-top:7px;
    color:rgba(var(--ink),.4);
    font-size:10px;
    font-weight:450;
    letter-spacing:.18em;
  }
  .mode-family-chart{
    display:block;
    width:100%;
    height:clamp(240px, 34vh, 360px);
    min-width:0;
    margin-top:0;
    overflow:visible;
  }
  .mode-family-axis{stroke:rgba(var(--ink),.2);stroke-width:1;}
  .mode-family-grid{stroke:rgba(var(--ink),.08);stroke-width:1;}
  .mode-family-tick{fill:rgb(var(--ink));font:7px sans-serif;opacity:.55;}
  .mode-family-curve{fill:none;stroke-width:1.6;opacity:.46;transition:opacity .15s,stroke-width .15s;}
  .mode-family-curve.selected{stroke-width:3;opacity:1;}
  .mode-family-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke;}
  .mode-family-points{fill:var(--bg);stroke-width:1.4;pointer-events:none;}
  .mode-picker button:focus-visible{
    outline:1px solid rgba(var(--ink),.45);
    outline-offset:2px;
  }
  .mode-set-selector{
    display:grid;
    grid-template-columns:38px minmax(0,1fr) 38px;
    align-items:center;
    gap:12px;
    margin-top:0;
  }
  .mode-set-arrows{
    display:flex;
    flex-direction:column;
    gap:2px;
    transform:translateY(13px);
  }
  .mode-picker .mode-set-arrows button{
    display:grid;
    place-items:center;
    min-height:30px;
    padding:0;
    border:0;
    background:transparent;
    font-size:17px;
    line-height:1;
    opacity:.7;
  }
  .mode-picker .mode-set-arrows button:hover{opacity:1;}
  .mode-set-display{
    display:grid;
    grid-template-columns:repeat(12,minmax(0,1fr));
    align-items:end;
    width:100%;
    min-height:48px;
    touch-action:none;
    user-select:none;
  }
  .mode-set-step{
    display:flex;
    min-width:0;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    gap:7px;
    grid-column:span var(--step);
    color:rgb(var(--ink));
    font-size:13px;
    font-variant-numeric:tabular-nums;
    line-height:1;
    cursor:grab;
  }
  .mode-set-display.dragging .mode-set-step{
    cursor:grabbing;
  }
  .mode-set-step::after{
    width:calc(100% - 4px);
    height:2px;
    background:rgba(var(--ink),.5);
    content:"";
  }
  .mode-set-name{
    height:1.4em;
    margin-top:7px;
    text-align:center;
    font-size:16px;
    line-height:1.4em;
    opacity:.62;
  }
  .mode-picker-apply{
    display:grid;
    place-items:center;
    width:38px;
    min-height:38px !important;
    padding:0 !important;
    border-radius:50%;
    opacity:.68;
  }
  .mode-picker-actions{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    transform:translateY(13px);
  }
  .mode-picker-presets-toggle{
    display:grid;
    place-items:center;
    width:38px;
    min-height:34px !important;
    padding:0 !important;
    border:0 !important;
    background:transparent !important;
    opacity:.68;
  }
  .mode-picker-presets-toggle:hover,
  .mode-picker-apply:hover{opacity:1;}
  .mode-picker-presets-toggle svg{
    width:18px;
    height:18px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .mode-picker-presets{
    position:absolute;
    left:0;
    top:calc(100% + 6px);
    z-index:5;
    width:min(240px, 70vw);
    max-height:min(280px, 45vh);
    overflow:auto;
    padding:6px;
    border:1px solid rgba(var(--ink),.18);
    border-radius:8px;
    background:var(--bg);
    box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  .mode-picker-presets h3{
    margin:6px 8px 3px;
    font-size:11px;
    font-weight:500;
    opacity:.58;
  }
  .mode-picker-presets h4{
    margin:6px 8px 2px;
    font-size:12px;
    font-weight:500;
    opacity:.8;
  }
  .mode-picker .mode-picker-presets button.mode-preset-scale{
    display:block;
    width:100%;
    min-height:32px;
    padding:5px 8px 5px 22px;
    border:0;
    background:transparent;
    text-align:left;
    font-size:12px;
  }
  .mode-picker .mode-picker-presets button.mode-preset-scale:hover,
  .mode-picker .mode-picker-presets button.mode-preset-scale:focus-visible{
    background:rgba(var(--ink),.08);
  }
  .mode-picker-apply svg{
    width:17px;
    height:17px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .mode-picker button{
    min-height:38px;
    padding:0 16px;
    border:1px solid rgba(var(--ink),.16);
    background:var(--bg);
    color:inherit;
    font:inherit;
    font-size:13px;
    cursor:pointer;
  }

  .arrow{
    flex:0 0 auto;
    background:none;border:0;
    padding:.5em .35em;
    font-family:inherit;
    font-size:clamp(18px,2.4vw,26px);
    font-weight:300;line-height:1;
    color:rgb(var(--ink));
    opacity:.13;
    cursor:pointer;
    transition:opacity .3s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .arrow:hover{opacity:.45;}
  .arrow:active{opacity:.7;}
  .arrow:focus{outline:none;}
  .arrow:focus-visible{opacity:.6;}

  .notes{
    position:relative;
    flex:0 0 auto;
    height:calc(var(--fs) * 2.2);
    overflow:hidden;
  }

  .note{
    position:absolute;top:0;left:0;
    width:var(--slotw);height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:var(--fs);
    font-weight:300;
    line-height:1;
    letter-spacing:.005em;
    color:rgba(var(--ink),.78);
    cursor:pointer;
    will-change:transform,opacity;
    -webkit-tap-highlight-color:transparent;
  }

  /*
    The inner element carries the accidental-dependent vertical shift
    via a CSS custom property. Because the shift lives inside `transform`,
    the CSS transition smoothly interpolates it whenever a note gains or
    loses its accidental during a scale change.
  */
  .inner{
    position:relative;
    display:grid;
    place-items:center;
    width:100%;
    transform: translateY(var(--shift, 0px));
    transition:transform .3s cubic-bezier(.2,.8,.3,1), color .25s ease;
  }
  .note:hover .inner{color:rgba(var(--ink),1);}
  .note.playing .inner{color:rgba(var(--ink),1);}
  .note.pressed .inner{
    transform: translateY(var(--shift, 0px)) scale(1.1);
    color:rgba(var(--ink),1);
  }

  .label{
    grid-area:1 / 1;
    display:flex;
    flex-direction:column;
    align-items:center;
    line-height:1;
    white-space:nowrap;
  }

  .letterLine{
    position:relative;
    display:inline-block;
    line-height:1;
    white-space:nowrap;
  }

  .pc{display:inline-block;}

  .acc{
    position:absolute;
    left:calc(100% + 1px);
    top:0;
    font-size:.5em;
    line-height:1;
    transform:translateY(.06em);
    opacity:0;
  }

  .quality{
    font-size:.22em;
    font-weight:300;
    letter-spacing:.02em;
    opacity:.45;
    margin-top:.16em;
    line-height:1;
    white-space:nowrap;
  }

  .vol{
    position:fixed;
    left:50%;
    bottom:calc(14vh + env(safe-area-inset-bottom, 0px));
    width:140px;height:14px;
    transform:translateX(-50%);
    opacity:.45;
    transition:opacity .35s ease;
    cursor:pointer;
    touch-action:none;
    z-index:5;
  }
  .vol.show{opacity:1;}
  .vol.dragging{cursor:grabbing;}
  .vol:focus{outline:none;}
  .vol:focus-visible{outline:1px solid rgba(var(--ink),.4);outline-offset:3px;}
  .vol-line{
    position:absolute;left:0;right:0;top:50%;
    height:1px;
    background:rgba(var(--ink),.3);
  }
  .vol-thumb{
    position:absolute;top:0;
    width:5px;height:14px;
    border-radius:1px;
    background:rgba(var(--ink),.7);
    transition:left .08s ease-out;
  }
  .settings-toggle{
    position:fixed;
    top:calc(12px + env(safe-area-inset-top, 0px));
    right:14px;
    display:grid;
    place-items:center;
    width:32px;
    height:32px;
    padding:0;
    border:0;
    background:none;
    color:rgba(var(--ink),.52);
    cursor:pointer;
    z-index:41;
    -webkit-tap-highlight-color:transparent;
  }
  .settings-toggle:hover,.settings-toggle:focus-visible{color:rgb(var(--ink));}
  .settings-toggle:focus{outline:none;}
  .settings-toggle:focus-visible{outline:1px solid rgba(var(--ink),.4);outline-offset:2px;}
  .settings-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
  .settings-panel{
    position:fixed;
    top:calc(50px + env(safe-area-inset-top, 0px));
    right:14px;
    width:min(340px, calc(100vw - 28px));
    max-height:min(72vh, 620px);
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:14px;
    border:1px solid rgba(var(--ink),.15);
    background:var(--bg);
    box-shadow:0 6px 24px rgba(var(--ink),.1);
    color:rgb(var(--ink));
    z-index:40;
  }
  .settings-panel[hidden]{display:none;}
  .settings-heading-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .settings-heading{font-size:13px;font-weight:450;letter-spacing:.02em;}
  .target-settings-reset{
    display:grid;
    place-items:center;
    flex:0 0 26px;
    width:26px;
    height:26px;
    padding:0;
    border:0;
    background:none;
    color:inherit;
    opacity:.58;
    cursor:pointer;
  }
  .target-settings-reset:hover,.target-settings-reset:focus-visible{opacity:1;}
  .target-settings-reset:focus{outline:none;}
  .target-settings-reset:focus-visible{outline:1px solid rgba(var(--ink),.45);outline-offset:1px;}
  .target-settings-reset svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .settings-description{margin-top:5px;font-size:11px;line-height:1.45;opacity:.58;}
  .target-order{display:grid;gap:4px;margin-top:12px;}
  .target-order-row{
    display:grid;
    grid-template-columns:30px minmax(0,1fr) 28px;
    align-items:center;
    min-height:34px;
    border:1px solid rgba(var(--ink),.1);
    background:rgba(var(--ink),.018);
  }
  .target-order-row.fixed{grid-template-columns:30px minmax(0,1fr);}
  .target-order-row.dragging{opacity:.42;}
  .target-order-name{font-size:12px;}
  .target-order-detail{display:block;margin-top:2px;font-size:10px;opacity:.52;}
  .target-order-grip,.target-order-remove{
    display:grid;
    place-items:center;
    width:28px;
    height:32px;
    border:0;
    background:none;
    color:inherit;
    opacity:.55;
    cursor:pointer;
  }
  .target-order-grip{cursor:grab;touch-action:none;font-size:16px;letter-spacing:-2px;}
  .target-order-grip:active{cursor:grabbing;}
  .target-order-remove{font-size:18px;line-height:1;}
  .target-order-grip:hover,.target-order-remove:hover,
  .target-order-grip:focus-visible,.target-order-remove:focus-visible{opacity:1;}
  .target-order-grip:focus,.target-order-remove:focus{outline:none;}
  .target-order-grip:focus-visible,.target-order-remove:focus-visible{outline:1px solid rgba(var(--ink),.4);outline-offset:-3px;}
  .target-order-copy{min-width:0;padding:5px 4px;}
  .target-add{display:flex;gap:6px;margin-top:10px;}
  .target-add select,.target-add button{
    min-height:32px;
    border:1px solid rgba(var(--ink),.16);
    border-radius:0;
    background:var(--bg);
    color:inherit;
    font:inherit;
    font-size:11px;
  }
  .target-add select{flex:1;min-width:0;padding:0 6px;}
  .target-add button{padding:0 10px;cursor:pointer;}
  .target-add button:disabled{opacity:.4;cursor:default;}

  const KEYS = [

  let keyIdx    = 0;
  let scaleData = buildScale(keyIdx, modeIdx);
  let modeRadius = 100;
  let modeDrag = null;
  let suppressModeClick = false;
  let slotW     = 80;
  let fontSize  = 44;
  let interactDist = 132;
  let cutoffY      = Infinity;  /* chords ignore the pointer below this y (the history lives there) */
  let noteEls   = [];
  let animating = false;
  let ac        = null;

  /* ================= audio ================= */

  /* every chord goes through one shared bus: master gain -> soft limiter.
     Overlapping chords (a new one starting while the old one rings out)
     used to add up past 0 dBFS, which is what sounded like clipping. */
  let bus = null;

  const TAIL      = 0.6;    /* normal ring-out after release (s) */
  const FAST_TAIL = 0.07;   /* ring-out when too many tails pile up (s) */
  const MAX_TAILS = 2;      /* chords allowed to ring out at once */
  const AUDIO_OUTPUT_GAIN = 0.9;
  const MODE_PICKER_FADE_SECONDS = 0.18;
  const tails     = [];     /* chords currently fading out, oldest first */

  function audio() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();

      const master = ac.createGain();
      master.gain.value = AUDIO_OUTPUT_GAIN;

      const lim = ac.createDynamicsCompressor();
      lim.threshold.value = -6;
      lim.knee.value      = 6;
      lim.ratio.value     = 12;
      lim.attack.value    = 0.003;
      lim.release.value   = 0.1;

      master.connect(lim);
      lim.connect(ac.destination);
      bus = master;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }

  function fadeAudioOutput(targetGain) {
    if (!ac || !bus) return;
    const gain = bus.gain;
    const now = ac.currentTime;
    if (gain.cancelAndHoldAtTime) {
      gain.cancelAndHoldAtTime(now);
    } else {
      gain.cancelScheduledValues(now);
      gain.setValueAtTime(gain.value, now);
    }
    gain.linearRampToValueAtTime(targetGain, now + MODE_PICKER_FADE_SECONDS);
  }

  function startChord(midi, quality, vol, inversion = 0) {
    const ctx = audio();
    const t   = ctx.currentTime;

    /* smooth exponential-style attack instead of a straight-line ramp */
    const out = ctx.createGain();
    out.gain.setValueAtTime(0, t);
    out.gain.setTargetAtTime(PEAK * vol * vol, t, 0.008);
    out.connect(bus);

    const parts = chordVoicing(quality, inversion)
      .map((part) => ({ s: part.semitones, g: part.weight }));

    /* normalise so a triad and a 7th chord have the same peak level */
    const total = parts.reduce((a, p) => a + p.g, 0);

    const oscs = [];
    for (const p of parts) {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = 440 * Math.pow(2, (midi + p.s - 69) / 12);
      const g = ctx.createGain();
      g.gain.value = p.g / total;
      osc.connect(g).connect(out);
      osc.start(t);
      oscs.push(osc);
    }

    let released = false;
    let lastV    = vol;

    function fade(time) {
      const rt = ctx.currentTime;
      if (out.gain.cancelAndHoldAtTime) {
        out.gain.cancelAndHoldAtTime(rt);
      } else {
        /* browsers without cancelAndHold: clear pending automation first,
           otherwise leftover events cause a jump */
        const cur = out.gain.value;
        out.gain.cancelScheduledValues(rt);
        out.gain.setValueAtTime(cur, rt);
      }
      out.gain.exponentialRampToValueAtTime(0.0001, rt + time);
      const end = rt + time + 0.03;
      for (const o of oscs) { try { o.stop(end); } catch (e) {} }
    }

    return {
      setVolume(v) {
        /* skip no-op updates so we don't flood the gain with automation */
        if (released || Math.abs(v - lastV) < 0.002) return;
        lastV = v;
        out.gain.setTargetAtTime(PEAK * v * v, ctx.currentTime, 0.04);
      },
      release() {
        if (released) return;
        released = true;
        fade(TAIL);

        const entry = { fast() { fade(FAST_TAIL); } };
        tails.push(entry);
        oscs[0].onended = () => {
          out.disconnect();
          const i = tails.indexOf(entry);
          if (i >= 0) tails.splice(i, 1);
        };

        /* too many overlapping tails: quickly fade the oldest ones */
        while (tails.length > MAX_TAILS) tails.shift().fast();
      }
    };
  }

  /* ================= note construction ================= */

  function writeLabel(label, name, quality) {
    const pcChar  = name.charAt(0);
    const accChar = name.slice(1);
    label._pc.textContent  = pcChar;
    label._acc.textContent = accChar;
    label._acc.style.opacity = accChar ? '1' : '0';
    label._quality.textContent = quality;
  }

  function makeLabel(name, quality) {
    const label = document.createElement('span');
    label.className = 'label';

    const letterLine = document.createElement('span');
    letterLine.className = 'letterLine';

    const pc  = document.createElement('span');
    pc.className = 'pc';
    const acc = document.createElement('span');
    acc.className = 'acc';

    letterLine.appendChild(pc);
    letterLine.appendChild(acc);

    const qual = document.createElement('span');
    qual.className = 'quality';

    label.appendChild(letterLine);
    label.appendChild(qual);

    label._pc      = pc;
    label._acc     = acc;
    label._quality = qual;

    writeLabel(label, name, quality);
    return label;
  }

  function applyShift(el, hasAcc) {
    el._accShift = hasAcc ? ACC_SHIFT : 0;
    el._inner.style.setProperty('--shift', el._accShift + 'px');
  }

  function buildNote(name, quality) {
    const el = document.createElement('div');
    el.className = 'note';

    const inner = document.createElement('div');
    inner.className = 'inner';
    el.appendChild(inner);
    el._inner = inner;

    const label = makeLabel(name, quality);
    inner.appendChild(label);
    el._label = label;

    applyShift(el, name.length > 1);

    return el;
  }

  function placeNote(el, slot) {
    el.dataset.slot    = String(slot);
    el.style.transform = `translateX(${slot * slotW}px)`;
  }

  function rebuildScaleNotes() {
    notesEl.querySelectorAll('.note').forEach((el) => el.remove());
    noteEls = scaleData.notes.map((name, slot) => {
      const el = buildNote(name, scaleData.labels[slot]);
      placeNote(el, slot);
      notesEl.appendChild(el);
      measureNoteBlob(el);
      return el;
    });
    animating = false;
  }

  /* ================= blob measurement ================= */

  function measureNoteBlob(el) {
    if (!el._label || el._dying || !el.isConnected) return;

    const label    = el._label;
    const noteRect = el.getBoundingClientRect();
    const pcRect   = label._pc.getBoundingClientRect();
    const qRect    = label._quality.getBoundingClientRect();
    const accRect  = label._acc.getBoundingClientRect();

    let left   = Math.min(pcRect.left,   qRect.left);
    let right  = Math.max(pcRect.right,  qRect.right);
    let top    = Math.min(pcRect.top,    qRect.top);
    let bottom = Math.max(pcRect.bottom, qRect.bottom);

    if (label._acc.textContent) {
      left   = Math.min(left,   accRect.left);
      right  = Math.max(right,  accRect.right);
      top    = Math.min(top,    accRect.top);
      bottom = Math.max(bottom, accRect.bottom);
    }

    const cx = (left + right) / 2;
    const cy = (top + bottom) / 2;

    const noteCX = noteRect.left + noteRect.width / 2;
    const noteCY = noteRect.top + noteRect.height / 2;

    const pad = fontSize * 0.22;
    const rx  = (right - left) / 2 + pad;
    const ry  = (bottom - top) / 2 + pad;
    let r     = Math.max(rx, ry);

    r = Math.min(r, slotW * 0.46);

    const tx = cx - noteCX;
    const ty = cy - noteCY;

    if (!el._blob) {
      el._blob = { x: tx, y: ty, r: r, tx: tx, ty: ty, tr: r };
    } else {
      el._blob.tx = tx;
      el._blob.ty = ty;
      el._blob.tr = r;
    }
  }

  /* ================= text transition (crossfade) ================= */

  function setNote(el, name, quality) {
    const cur = el._label;
    const pc  = name.charAt(0);
    const acc = name.slice(1);

    if (cur._pc.textContent === pc &&
        cur._acc.textContent === acc &&
        cur._quality.textContent === quality) return;

    const next = makeLabel(name, quality);
    el._inner.appendChild(next);

    next.animate(
      [{ opacity: 0 }, { opacity: 1 }],
      { duration: XFADE, easing: 'ease', fill: 'both' }
    );

    const out = cur.animate(
      [{ opacity: 1 }, { opacity: 0 }],
      { duration: XFADE, easing: 'ease', fill: 'both' }
    );
    out.onfinish = () => cur.remove();

    el._label = next;
    applyShift(el, name.length > 1);
    measureNoteBlob(el);
  }

  function cancelModeChoiceMotion(choice) {
    if (!choice._modePositionAnimation) return;
    choice._modePositionAnimation.cancel();
    choice._modePositionAnimation = null;
  }

  function freezeModeChoicePosition(choice) {
    const position = getComputedStyle(choice);
    const left = position.left;
    const top = position.top;
    cancelModeChoiceMotion(choice);
    choice.style.left = left;
    choice.style.top = top;
  }

  function setModeChoicePosition(choice, offset, animate) {
    const angle = -offset * Math.PI / 6;
    const left = modeRadius * Math.cos(angle);
    const top = modeRadius + modeRadius * Math.sin(angle);
    const computed = getComputedStyle(choice);
    const fromLeft = parseFloat(computed.left);
    const fromTop = parseFloat(computed.top);
    cancelModeChoiceMotion(choice);

    if (!animate || !Number.isFinite(fromLeft) || !Number.isFinite(fromTop)) {
      choice.style.left = left.toFixed(1) + 'px';
      choice.style.top = top.toFixed(1) + 'px';
      choice._modePositionInitialized = true;
      return;
    }

    const startAngle = Math.atan2(fromTop - modeRadius, fromLeft);
    let angleDelta = angle - startAngle;
    while (angleDelta > Math.PI) angleDelta -= Math.PI * 2;
    while (angleDelta < -Math.PI) angleDelta += Math.PI * 2;
    if (Math.abs(angleDelta) < 0.001) {
      choice.style.left = left.toFixed(1) + 'px';
      choice.style.top = top.toFixed(1) + 'px';
      choice._modePositionInitialized = true;
      return;
    }

    const steps = Math.max(4, Math.ceil(Math.abs(angleDelta) * modeRadius / 4));
    const frames = Array.from({ length: steps + 1 }, (_, step) => {
      const currentAngle = startAngle + angleDelta * step / steps;
      return {
        left: (modeRadius * Math.cos(currentAngle)).toFixed(2) + 'px',
        top: (modeRadius + modeRadius * Math.sin(currentAngle)).toFixed(2) + 'px',
      };
    });
    const animation = choice.animate(frames, {
      duration: 220,
      easing: 'linear',
      fill: 'forwards',
    });
    choice._modePositionAnimation = animation;
    animation.onfinish = () => {
      if (choice._modePositionAnimation !== animation) return;
      choice.style.left = left.toFixed(1) + 'px';
      choice.style.top = top.toFixed(1) + 'px';
      choice._modePositionInitialized = true;
      choice._modePositionAnimation = null;
      animation.cancel();
    };
  }

  function updateModeWheel(animate = true) {
    modeChoices.forEach((choice) => {
      const index = Number(choice.dataset.mode);
      let offset = (index - modeIdx + MODES.length) % MODES.length;
      if (offset > Math.floor(MODES.length / 2)) offset -= MODES.length;
      const hidden = Math.abs(offset) > 2;
      const wasHidden = choice.classList.contains('hidden-neighbor');

      if (hidden) {
        if (!wasHidden) {
          const wasPositioned = choice._modePositionInitialized;
          if (!wasPositioned) {
            setModeChoicePosition(choice, Math.sign(offset) * 3, false);
          } else {
            freezeModeChoicePosition(choice);
          }
          choice.classList.add('hidden-neighbor');
          if (wasPositioned) {
            choice._modeHideTimer = setTimeout(() => {
              choice._modeHideTimer = 0;
              if (!choice.classList.contains('hidden-neighbor')) return;
              let currentOffset = (index - modeIdx + MODES.length) % MODES.length;
              if (currentOffset > Math.floor(MODES.length / 2)) currentOffset -= MODES.length;
              if (Math.abs(currentOffset) > 2) {
                setModeChoicePosition(choice, Math.sign(currentOffset) * 3, false);
              }
            }, 220);
          }
        } else if (!choice._modeHideTimer) {
          setModeChoicePosition(choice, Math.sign(offset) * 3, false);
        }
        choice.setAttribute('aria-hidden', 'true');
        choice.tabIndex = -1;
      } else {
        if (wasHidden) {
          if (choice._modeHideTimer) {
            clearTimeout(choice._modeHideTimer);
            choice._modeHideTimer = 0;
          }
          setModeChoicePosition(choice, offset, false);
          choice.classList.remove('hidden-neighbor');
        } else {
          setModeChoicePosition(choice, offset, animate);
        }
        choice.setAttribute('aria-hidden', 'false');
        choice.tabIndex = 0;
      }
      choice.classList.toggle('active', index === modeIdx);
      choice.setAttribute('aria-pressed', String(index === modeIdx));
    });
    modeWheel.setAttribute('aria-label',
      KEYS[keyIdx].notes[0] + ' ' + MODES[modeIdx].name +
      ' mode selector; drag up or down to change mode, or double-click a mode to choose a scale family');
    modeWheel.classList.add('ready');
  }

  function selectMode(index) {
    const nextMode = (index + MODES.length) % MODES.length;
    if (nextMode === modeIdx) return;
    modeIdx = nextMode;
    scaleData = buildScale(keyIdx, modeIdx);
    finishRightPreview();
    noteEls.forEach((el, slot) => setNote(el, scaleData.notes[slot], scaleData.labels[slot]));
    updateModeWheel();
    persistModeSelection();
  }

  function choosePickerDistribution(distribution) {
    const currentFamily = MODE_FAMILY_BY_ID.get(pickerFamilyId);
    const selectedFamilyId = currentFamily &&
      currentFamily.distributionKey === distribution
      ? currentFamily.id
      : null;
    pickerDistributionKey = distribution;
    populateModeFamilies(pickerCardinality, selectedFamilyId);
  }

  function persistModeSelection() {
    try {
      localStorage.setItem(MODE_FAMILY_STORAGE_KEY, JSON.stringify({
        familyId: activeModeFamily.id,
        rootSteps: MODES[modeIdx].steps,
      }));
    } catch (error) {
      console.warn('Unable to save the selected scale family.', error);
    }
  }

  let pickerDistributionKey = null;
  let pickerFamilyId = null;
  let pickerCardinality = scaleCardinality;
  let pickerSteps = null;
  let pickerPresetModeName = null;
  let modeSetDrag = null;
  let modePickerPausedProgression = null;
  let modePickerAudioWasRunning = false;
  const MODE_FAMILY_COLORS = [
    '#527c9b', '#a96f58', '#61886f', '#9a7baf', '#ad9146',
    '#4c9290', '#b4647f', '#71814c', '#786a9b', '#a47742',
    '#5986a9', '#8e765d',
  ];

  function scoreDistribution(distribution, cardinality) {
    const averageStep = OCTAVE_SEMITONES / cardinality;
    let penalty = 0;
    for (let step = 1; step <= OCTAVE_SEMITONES; step++) {
      const count = distribution[step];
      penalty += count * (step - averageStep) ** 2;
      if (step >= 5) {
        penalty += count * 8 * (step - 4) ** 2;
      }
    }
    return -penalty;
  }

  function getDistributionGroups(cardinality) {
    const groups = new Map();
    for (const family of MODE_FAMILIES_BY_CARDINALITY.get(cardinality) || []) {
      if (!groups.has(family.distributionKey)) {
        groups.set(family.distributionKey, {
          key: family.distributionKey,
          distribution: family.distribution,
          families: [],
        });
      }
      groups.get(family.distributionKey).families.push(family);
    }
    return Array.from(groups.values()).sort((a, b) => {
      const scoreDifference =
        scoreDistribution(b.distribution, cardinality) -
        scoreDistribution(a.distribution, cardinality);
      if (scoreDifference !== 0) return scoreDifference;
      for (let step = 1; step <= OCTAVE_SEMITONES; step++) {
        if (a.distribution[step] !== b.distribution[step]) {
          return b.distribution[step] - a.distribution[step];
        }
      }
      return 0;
    });
  }

  function svgElement(name, attributes = {}) {
    const element = document.createElementNS('http://www.w3.org/2000/svg', name);
    for (const [key, value] of Object.entries(attributes)) {
      element.setAttribute(key, String(value));
    }
    return element;
  }

  function smoothDistributionPath(distribution, cardinality) {
    const left = 25, right = 292, top = 10, bottom = 121;
    const points = Array.from({ length: OCTAVE_SEMITONES }, (_, index) => {
      const step = index + 1;
      return {
        x: left + (step - 1) / (OCTAVE_SEMITONES - 1) * (right - left),
        y: bottom - distribution[step] / cardinality * (bottom - top),
      };
    });
    const spacing = points[1].x - points[0].x;
    const secants = points.slice(0, -1).map((point, index) =>
      (points[index + 1].y - point.y) / spacing);
    const tangents = points.map((_, index) => {
      if (index === 0) return secants[0];
      if (index === points.length - 1) return secants[secants.length - 1];
      const before = secants[index - 1];
      const after = secants[index];
      if (before === 0 || after === 0 || Math.sign(before) !== Math.sign(after)) return 0;
      return (before + after) / 2;
    });
    for (let index = 0; index < secants.length; index++) {
      const slope = secants[index];
      if (slope === 0) {
        tangents[index] = 0;
        tangents[index + 1] = 0;
        continue;
      }
      let alpha = tangents[index] / slope;
      let beta = tangents[index + 1] / slope;
      if (alpha < 0) {
        tangents[index] = 0;
        alpha = 0;
      }
      if (beta < 0) {
        tangents[index + 1] = 0;
        beta = 0;
      }
      const magnitude = alpha * alpha + beta * beta;
      if (magnitude > 9) {
        const scale = 3 / Math.sqrt(magnitude);
        tangents[index] = scale * alpha * slope;
        tangents[index + 1] = scale * beta * slope;
      }
    }

    let path = `M ${points[0].x} ${points[0].y}`;
    for (let index = 0; index < points.length - 1; index++) {
      const current = points[index];
      const next = points[index + 1];
      const control1x = current.x + spacing / 3;
      const control1y = current.y + tangents[index] * spacing / 3;
      const control2x = next.x - spacing / 3;
      const control2y = next.y - tangents[index + 1] * spacing / 3;
      path += ` C ${control1x} ${control1y}, ${control2x} ${control2y}, ${next.x} ${next.y}`;
    }
    return { path, points };
  }

  function renderDistributionChart(cardinality, groups) {
    modeFamilyChart.replaceChildren();
    modeFamilyChart.setAttribute('viewBox', '0 0 300 160');
    modeFamilyChart.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    const top = 10, bottom = 121, left = 25, right = 292;
    const maxCount = Math.max(1, cardinality);
    for (let count = 0; count <= maxCount; count++) {
      const y = bottom - count / maxCount * (bottom - top);
      modeFamilyChart.appendChild(svgElement('line', {
        x1: left, y1: y, x2: right, y2: y,
        class: count === 0 ? 'mode-family-axis' : 'mode-family-grid',
      }));
      const tick = svgElement('text', {
        x: left - 5, y: y + 3, 'text-anchor': 'end', class: 'mode-family-tick',
      });
      tick.textContent = String(count);
      modeFamilyChart.appendChild(tick);
    }
    modeFamilyChart.append(
      svgElement('line', { x1: left, y1: top, x2: left, y2: bottom, class: 'mode-family-axis' })
    );
    for (let step = 1; step <= OCTAVE_SEMITONES; step++) {
      const x = left + (step - 1) / (OCTAVE_SEMITONES - 1) * (right - left);
      const tick = svgElement('text', {
        x, y: 138, 'text-anchor': 'middle', class: 'mode-family-tick',
      });
      tick.textContent = String(step);
      modeFamilyChart.appendChild(tick);
    }
    const xLabel = svgElement('text', {
      x: (left + right) / 2, y: 154, 'text-anchor': 'middle', class: 'mode-family-tick',
    });
    xLabel.textContent = 'step size (semitones)';
    modeFamilyChart.appendChild(xLabel);
    const yLabel = svgElement('text', {
      x: 7, y: 66, transform: 'rotate(-90 7 66)',
      'text-anchor': 'middle', class: 'mode-family-tick',
    });
    yLabel.textContent = 'count';
    modeFamilyChart.appendChild(yLabel);

    groups.forEach((group, index) => {
      const color = MODE_FAMILY_COLORS[index % MODE_FAMILY_COLORS.length];
      const { path, points } = smoothDistributionPath(group.distribution, cardinality);
      const selected = group.key === pickerDistributionKey;
      const curve = svgElement('path', {
        d: path,
        class: `mode-family-curve${selected ? ' selected' : ''}`,
        stroke: color,
        'data-distribution': group.key,
      });
      const hitTarget = svgElement('path', {
        d: path,
        class: 'mode-family-hit',
        'data-distribution': group.key,
        tabindex: 0,
        role: 'button',
        'aria-label': `Select set family ${distributionLabel(group.distribution)}`,
        'aria-pressed': selected,
      });
      modeFamilyChart.append(curve, hitTarget);
      if (selected) {
        const circles = svgElement('g', { class: 'mode-family-points', stroke: color });
        points.forEach((point, pointIndex) => {
          if (!group.distribution[pointIndex + 1]) return;
          circles.appendChild(svgElement('circle', {
            cx: point.x, cy: point.y, r: 2.4,
          }));
        });
        modeFamilyChart.appendChild(circles);
      }
    });

  }

  function updateModeSetDisplay(family, steps = family.steps, presetName = null) {
    modeSetDisplay.setAttribute(
      'aria-label',
      `Current set: ${intervalPatternLabel(steps)}`,
    );
    renderModeSetSteps(steps);

    const familyName = family.label.split(' — ').at(-1);
    const namedSet = familyName && familyName !== 'Generated family'
      ? familyName.replace(/ family$/, '')
      : '';
    modeSetName.textContent = presetName
      ? `“${presetName}”`
      : namedSet && namedSet !== intervalPatternLabel(steps)
      ? `“${namedSet}”`
      : '';
  }

  function renderModeSetSteps(steps, changedIndexes = null) {
    modeSetDisplay.replaceChildren();
    steps.forEach((step, index) => {
      const interval = document.createElement('span');
      interval.className = 'mode-set-step';
      interval.dataset.index = String(index);
      interval.style.setProperty('--step', String(step));
      interval.textContent = String(step);
      interval.setAttribute(
        'aria-label',
        `${step} semitone${step === 1 ? '' : 's'}`,
      );
      modeSetDisplay.appendChild(interval);
      if (changedIndexes?.has(index) &&
          !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        interval.animate([
          {
            opacity: 0.7,
            transform: 'translateY(2px) scale(.96)',
          },
          { opacity: 1, transform: 'translateY(0) scale(1)' },
        ], {
          duration: 180,
          easing: 'cubic-bezier(.2,.8,.2,1)',
        });
      }
    });
  }

  function selectPickerFamily(familyId) {
    const family = MODE_FAMILY_BY_ID.get(familyId);
    if (!family) throw new Error('Selected scale family is unavailable: ' + familyId);
    pickerFamilyId = family.id;
    pickerSteps = family.steps.slice();
    pickerPresetModeName = null;
    updateModeSetDisplay(family, pickerSteps);
  }

  function cyclePickerFamily(direction) {
    const families = (MODE_FAMILIES_BY_CARDINALITY.get(
      pickerCardinality,
    ) || [])
      .filter((family) => family.distributionKey === pickerDistributionKey)
      .sort((a, b) => a.label.localeCompare(b.label));
    const currentIndex = families.findIndex((family) => family.id === pickerFamilyId);
    if (!families.length || currentIndex < 0) return;
    const nextIndex = (currentIndex + direction + families.length) % families.length;
    selectPickerFamily(families[nextIndex].id);
  }

  function populateModeFamilies(cardinality, selectedFamilyId = null) {
    pickerCardinality = cardinality;
    modeCardinalityValue.textContent = String(cardinality);
    modeCardinalityPrevious.disabled = cardinality <= MIN_SCALE_CARDINALITY;
    modeCardinalityNext.disabled = cardinality >= OCTAVE_SEMITONES;
    const groups = getDistributionGroups(cardinality);
    const families = MODE_FAMILIES_BY_CARDINALITY.get(cardinality) || [];
    const requestedFamily = selectedFamilyId
      ? families.find((family) => family.id === selectedFamilyId)
      : null;
    const selectedGroup = requestedFamily
      ? groups.find((group) => group.key === requestedFamily.distributionKey)
      : groups.find((group) => group.key === pickerDistributionKey) || groups[0];
    if (!selectedGroup) {
      throw new Error('No interval families available for cardinality ' + cardinality);
    }
    pickerDistributionKey = selectedGroup.key;
    renderDistributionChart(cardinality, groups);
    const defaultFamily = selectedGroup.families.find((family) =>
      family.id === (selectedFamilyId || activeModeFamily.id)) || selectedGroup.families[0];
    if (!defaultFamily) {
      throw new Error('No interval families available for cardinality ' + cardinality);
    }
    selectPickerFamily(defaultFamily.id);
  }

  function namedPresetFamilyLabel(mode) {
    const steps = intervalSteps(mode);
    const familyId = canonicalSteps(steps).join(',');
    const family = MODE_FAMILY_BY_ID.get(familyId);
    const familyName = family?.label.split(' — ').at(-1);
    if (mode.family && mode.family !== mode.name) {
      return `${mode.family} Set`;
    }
    if (familyName && familyName !== 'Generated family' &&
        !/^\d+$/.test(familyName)) {
      return familyName.replace(/\bset\b/i, 'Set');
    }
    return `${mode.name} Family`;
  }

  function populateNamedScalePresets() {
    modePickerPresets.replaceChildren();
    const groups = new Map();
    for (const mode of NAMED_SCALE_PRESETS) {
      const cardinality = mode.intervals.length;
      if (!groups.has(cardinality)) groups.set(cardinality, new Map());
      const familyName = namedPresetFamilyLabel(mode);
      const families = groups.get(cardinality);
      if (!families.has(familyName)) families.set(familyName, []);
      families.get(familyName).push(mode);
    }

    for (const [cardinality, families] of groups) {
      const heading = document.createElement('h3');
      heading.textContent = `Cardinality ${cardinality}`;
      modePickerPresets.appendChild(heading);
      for (const [familyName, modes] of Array.from(families.entries())
        .sort(([a], [b]) => a.localeCompare(b))) {
        const familyHeading = document.createElement('h4');
        familyHeading.textContent = familyName;
        modePickerPresets.appendChild(familyHeading);
        for (const mode of modes.sort((a, b) => a.name.localeCompare(b.name))) {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'mode-preset-scale';
          option.textContent = mode.name;
          option.addEventListener('click', () => selectNamedScalePreset(mode));
          modePickerPresets.appendChild(option);
        }
      }
    }
  }

  function selectNamedScalePreset(mode) {
    const steps = intervalSteps(mode);
    const familyId = canonicalSteps(steps).join(',');
    const family = MODE_FAMILY_BY_ID.get(familyId);
    if (!family) {
      throw new Error('Named scale preset is unavailable: ' + mode.name);
    }
    populateModeFamilies(steps.length, family.id);
    pickerSteps = steps;
    pickerPresetModeName = mode.name;
    updateModeSetDisplay(family, pickerSteps, mode.name);
    modePickerPresets.hidden = true;
    modePickerPresetsToggle.setAttribute('aria-expanded', 'false');
    modePickerPresetsToggle.focus();
  }

  function openModePicker() {
    if (!modePicker.hidden) return;
    populateModeFamilies(scaleCardinality, activeModeFamily.id);
    modePickerPausedProgression = pauseProgressionPlaybackForModePicker();
    modePickerAudioWasRunning = !!ac && ac.state === 'running';
    if (modePickerAudioWasRunning) fadeAudioOutput(0);
    modePickerBackdrop.hidden = false;
    modePicker.hidden = false;
    modePickerBackgroundStates = Array.from(document.body.children)
      .filter((element) => element !== modePicker && element !== modePickerBackdrop)
      .map((element) => {
        const wasInert = element.inert;
        element.inert = true;
        return { element, wasInert };
      });
  }

  function changePickerCardinality(direction) {
    const cardinality = Math.max(
      MIN_SCALE_CARDINALITY,
      Math.min(OCTAVE_SEMITONES, pickerCardinality + direction),
    );
    if (cardinality !== pickerCardinality) populateModeFamilies(cardinality);
  }

  function closeModePicker() {
    modePicker.hidden = true;
    modePickerBackdrop.hidden = true;
    modePickerPresets.hidden = true;
    modePickerPresetsToggle.setAttribute('aria-expanded', 'false');
    for (const { element, wasInert } of modePickerBackgroundStates || []) {
      element.inert = wasInert;
    }
    modePickerBackgroundStates = null;
    const pausedProgression = modePickerPausedProgression;
    modePickerPausedProgression = null;
    if (modePickerAudioWasRunning && ac && ac.state === 'running') {
      fadeAudioOutput(AUDIO_OUTPUT_GAIN);
    }
    resumeProgressionPlaybackAfterModePicker(pausedProgression);
    modePickerAudioWasRunning = false;
  }

  function applyModeFamily() {
    const family = MODE_FAMILY_BY_ID.get(pickerFamilyId);
    if (!family) {
      throw new Error('Selected scale family is unavailable: ' + pickerFamilyId);
    }
    activeModeFamily = family;
    scaleCardinality = family.cardinality;
    MODES = family.modes;
    const presetIndex = pickerPresetModeName
      ? family.modes.findIndex((mode) => mode.name === pickerPresetModeName)
      : -1;
    modeIdx = presetIndex >= 0 ? presetIndex : defaultModeIndex(family);
    scaleData = buildScale(keyIdx, modeIdx);
    finishClickPreview();
    finishRightPreview();
    clearLatchedChord();
    rebuildModeChoices();
    updateModeWheel(false);
    rebuildScaleNotes();
    layout();
    persistModeSelection();
    closeModePicker();
  }

  /* ================= sliding ================= */

  function slide(el, from, to, fromOpacity, toOpacity, done) {
    const kf = [];
    const k0 = { transform: from };
    if (fromOpacity !== undefined) k0.opacity = fromOpacity;
    const k1 = { transform: to };
    if (toOpacity !== undefined) k1.opacity = toOpacity;
    kf.push(k0, k1);

    const anim = el.animate(kf, { duration: DUR, easing: EASE, fill: 'forwards' });
    anim.onfinish = () => {
      el.style.transform = to;
      if (toOpacity !== undefined) el.style.opacity = String(toOpacity);
      anim.cancel();
      if (done) done();
    };
  }

  function shift(moveLeft) {
    if (animating || noteEls.length !== scaleCardinality + 1) return;
    animating = true;

    keyIdx = (keyIdx + (moveLeft ? 1 : -1) + KEYS.length) % KEYS.length;
    scaleData = buildScale(keyIdx, modeIdx);
    finishRightPreview(false);
    clearLatchedChord();
    updateModeWheel();
    const names = scaleData.notes;
    const labels = scaleData.labels;
    const sameScaleDegreeLetters = noteEls.every((el, slot) =>
      el._label._pc.textContent === names[slot].charAt(0));
    if (sameScaleDegreeLetters) {
      noteEls.forEach((el, slot) => {
        setNote(el, names[slot], labels[slot]);
      });
      setTimeout(() => { animating = false; }, DUR);
      return;
    }

    const old = noteEls.slice();
    const noteCount = old.length;
    const lastSlot = noteCount - 1;
    const next = new Array(noteCount);

    if (moveLeft) {
      const exiting = old[0];
      exiting._dying = true;
      exiting.style.pointerEvents = 'none';
      slide(exiting, 'translateX(0px)', `translateX(${-slotW}px)`, 1, 0, () =>
        exiting.remove());

      for (let index = 1; index < noteCount; index++) {
        const el = old[index];
        const newSlot = index - 1;
        setNote(el, names[newSlot], labels[newSlot]);
        placeNote(el, newSlot);
        slide(el, `translateX(${index * slotW}px)`, `translateX(${newSlot * slotW}px)`);
        next[newSlot] = el;
      }

      const entering = buildNote(names[lastSlot], labels[lastSlot]);
      entering.style.pointerEvents = 'none';
      entering.style.opacity = '0';
      entering.style.transform = `translateX(${noteCount * slotW}px)`;
      notesEl.appendChild(entering);
      placeNote(entering, lastSlot);
      measureNoteBlob(entering);
      slide(
        entering,
        `translateX(${noteCount * slotW}px)`,
        `translateX(${lastSlot * slotW}px)`,
        0,
        1,
        () => { entering.style.pointerEvents = ''; },
      );
      next[lastSlot] = entering;
    } else {
      const exiting = old[lastSlot];
      exiting._dying = true;
      exiting.style.pointerEvents = 'none';
      slide(
        exiting,
        `translateX(${lastSlot * slotW}px)`,
        `translateX(${noteCount * slotW}px)`,
        1,
        0,
        () => exiting.remove(),
      );

      for (let index = 0; index < lastSlot; index++) {
        const el = old[index];
        const newSlot = index + 1;
        setNote(el, names[newSlot], labels[newSlot]);
        placeNote(el, newSlot);
        slide(el, `translateX(${index * slotW}px)`, `translateX(${newSlot * slotW}px)`);
        next[newSlot] = el;
      }

      const entering = buildNote(names[0], labels[0]);
      entering.style.pointerEvents = 'none';
      entering.style.opacity = '0';
      entering.style.transform = `translateX(${-slotW}px)`;
      notesEl.appendChild(entering);
      placeNote(entering, 0);
      measureNoteBlob(entering);
      slide(
        entering,
        `translateX(${-slotW}px)`,
        'translateX(0px)',
        0,
        1,
        () => { entering.style.pointerEvents = ''; },
      );
      next[0] = entering;
    }

    noteEls = next;
    setTimeout(() => { animating = false; }, DUR);
  }

  /* ==================================================================
     GOOEY BLOB CURSOR
     ================================================================== */

  const svgEl      = document.getElementById('blob');
  const dashedPath = document.getElementById('blobPath');
  const solidPath  = document.getElementById('blobPathSolid');

  const MOUSE_R  = 12;
  const FADE_T   = 150;
  const LEAD     = 0.035;
  const MAX_LEAD = 45;

  const pointer = { x: -9999, y: -9999, active: false };
  let pvx = 0, pvy = 0;
  let lastMoveX = 0, lastMoveY = 0, lastMoveT = 0;

  let lastT = 0;

  const chord = { x: 0, y: 0, r: 0, el: null, init: false };
  let dashedAlpha = 0;

  const solid = { x: 0, y: 0, r: 0, init: false, alpha: 0 };

  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

  function sampleArc(cx, cy, r, a0, a1, n, out, skipFirst) {
    for (let i = skipFirst ? 1 : 0; i <= n; i++) {
      const a = a0 + (a1 - a0) * (i / n);
      out.push(cx + r * Math.cos(a), cy + r * Math.sin(a));
    }
  }

  function sampleCubic(x0,y0, x1,y1, x2,y2, x3,y3, n, out, skipFirst) {
    for (let i = skipFirst ? 1 : 0; i <= n; i++) {
      const t  = i / n, mt = 1 - t;
      const a = mt*mt*mt, b = 3*mt*mt*t, c = 3*mt*t*t, d = t*t*t;
      out.push(a*x0 + b*x1 + c*x2 + d*x3,
               a*y0 + b*y1 + c*y2 + d*y3);
    }
  }

  function inwardDir(ax, ay, ux, uy, x0, y0, x1, y1, fx, fy) {
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    const t  = (mx - ax) * ux + (my - ay) * uy;
    const px = ax + ux * t,   py = ay + uy * t;
    const ix = px - mx, iy = py - my;
    const len = Math.hypot(ix, iy);
    if (len < 0.001) return { x: fx, y: fy };
    return { x: ix / len, y: iy / len };
  }

  /* slow, breathing wobble field */
  function wobble(x, y, t) {
    return 2.0 * Math.sin(x * 0.043 + y * 0.029 + 1.7 + t * 0.0015)
         + 1.2 * Math.sin(x * 0.109 - y * 0.077 + 4.2 + t * 0.0023)
         + 0.55 * Math.sin(x * 0.213 + y * 0.171 + 2.1 + t * 0.0031);
  }

  /* finer, higher-frequency shape variation */
  function fineNoise(x, y, t) {
    return 0.55 * Math.sin(x * 0.51 + y * 0.79 + t * 0.0049)
         + 0.32 * Math.sin(x * 0.93 - y * 0.83 + t * 0.0036)
         + 0.16 * Math.sin(x * 1.27 + y * 1.13 + t * 0.0061);
  }

  function pathFromPoints(pts, t) {
    const n = pts.length / 2;
    let d = '';
    for (let i = 0; i < n; i++) {
      const x  = pts[i * 2], y = pts[i * 2 + 1];
      const ip = (i - 1 + n) % n, inx = (i + 1) % n;

      let tx = pts[inx * 2] - pts[ip * 2];
      let ty = pts[inx * 2 + 1] - pts[ip * 2 + 1];
      const tl = Math.hypot(tx, ty) || 1;

      const nx = -ty / tl, ny = tx / tl;
      const w  = wobble(x, y, t) + fineNoise(x, y, t);

      d += (i === 0 ? 'M' : 'L') +
           (x + nx * w).toFixed(2) + ' ' +
           (y + ny * w).toFixed(2);
    }
    return d + 'Z';
  }

  function circlePath(cx, cy, r, t) {
    const pts = [];
    sampleArc(cx, cy, r, 0, Math.PI * 2, 120, pts, false);
    pts.length -= 2;
    return pathFromPoints(pts, t);
  }

  function buildBlob(ax, ay, ra, bx, by, rb, t) {
    const dx = bx - ax, dy = by - ay;
    const dist = Math.hypot(dx, dy) || 0.001;

    const alpha = Math.atan2(dy, dx);
    const phi   = Math.acos(clamp((ra - rb) / dist, -1, 1));
    const ux    = dx / dist, uy = dy / dist;

    const pts = [];

    /* long way round the chord */
    sampleArc(ax, ay, ra, alpha + phi, alpha + 2 * Math.PI - phi, 120, pts, false);

    /* neck: chord → cursor */
    const n2x = Math.cos(alpha - phi), n2y = Math.sin(alpha - phi);
    const p2x = ax + ra * n2x, p2y = ay + ra * n2y;
    const q2x = bx + rb * n2x, q2y = by + rb * n2y;
    const in2 = inwardDir(ax, ay, ux, uy, p2x, p2y, q2x, q2y, -n2x, -n2y);
    const h   = 0.20 * (ra + rb) * 4 / 3;

    sampleCubic(
      p2x, p2y,
      p2x + (q2x - p2x) / 3 + in2.x * h, p2y + (q2y - p2y) / 3 + in2.y * h,
      p2x + 2 * (q2x - p2x) / 3 + in2.x * h, p2y + 2 * (q2y - p2y) / 3 + in2.y * h,
      q2x, q2y,
      48, pts, true
    );

    /* short way round the cursor */
    sampleArc(bx, by, rb, alpha - phi, alpha + phi, 120, pts, true);

    /* neck: cursor → chord */
    const n1x = Math.cos(alpha + phi), n1y = Math.sin(alpha + phi);
    const p1x = ax + ra * n1x, p1y = ay + ra * n1y;
    const q1x = bx + rb * n1x, q1y = by + rb * n1y;
    const in1 = inwardDir(ax, ay, ux, uy, q1x, q1y, p1x, p1y, -n1x, -n1y);

    sampleCubic(
      q1x, q1y,
      q1x + (p1x - q1x) / 3 + in1.x * h, q1y + (p1y - q1y) / 3 + in1.y * h,
      q1x + 2 * (p1x - q1x) / 3 + in1.x * h, q1y + 2 * (p1y - q1y) / 3 + in1.y * h,
      p1x, p1y,
      48, pts, true
    );

    pts.length -= 2;
    return pathFromPoints(pts, t);
  }

  function drawBlob(path, st, px, py, now) {
    const ra = st.r;
    const rb = Math.min(MOUSE_R, ra * 0.9);
    const d  = Math.hypot(px - st.x, py - st.y);

    if (d <= ra - rb) {
      path.setAttribute('d', circlePath(st.x, st.y, ra, now));
    } else {
      path.setAttribute('d', buildBlob(st.x, st.y, ra, px, py, rb, now));
    }
  }

  function nearestNote(excludeEl, x = pointer.x, y = pointer.y) {
    let best = null, bestD2 = Infinity;
    for (let i = 0; i < noteEls.length; i++) {
      const el = noteEls[i];
      if (el._dying || !el._blob) continue;
      if (excludeEl && el === excludeEl) continue;

      const r  = el.getBoundingClientRect();
      const bx = r.left + r.width / 2  + el._blob.x;
      const by = r.top  + r.height / 2 + el._blob.y;

      const ddx = bx - x, ddy = by - y;
      const d2  = ddx * ddx + ddy * ddy;
      if (d2 < bestD2) {
        bestD2 = d2;
        best = { el, bx, by, r: el._blob.r, d2 };
      }
    }
    return best;
  }

  /* ---------- click playback ---------- */

  let latchedChord = null;
  let heldInversion = null;
  let activeNotePlaybackEnabled = true;
  let clickPreview = null;
  let rightPreview = null;

  function blobCenter(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2 + el._blob.x,
             y: r.top  + r.height / 2 + el._blob.y };
  }

  /* ---- master volume, driven by the scroll wheel ---- */
  let masterVol = 0.8;
  let volHideT  = 0;
  const volEl    = document.getElementById('vol');
  const volThumb = document.getElementById('volThumb');

  function updateVolumeDisplay() {
    const trackW = volEl.clientWidth, thumbW = volThumb.offsetWidth;
    volThumb.style.left = (masterVol * (trackW - thumbW)).toFixed(1) + 'px';
    volEl.setAttribute('aria-valuenow', String(Math.round(masterVol * 100)));
  }

  function showVolume() {
    updateVolumeDisplay();
    volEl.classList.add('show');
    clearTimeout(volHideT);
    volHideT = setTimeout(() => volEl.classList.remove('show'), 1100);
  }

  function setMasterVol(v) {
    masterVol = clamp(v, 0, 1);
    if (latchedChord && latchedChord.handle) latchedChord.handle.setVolume(masterVol);
    if (clickPreview) clickPreview.handle.setVolume(masterVol);
    if (rightPreview) rightPreview.handle.setVolume(masterVol);
    if (progressionPlayback && progressionPlayback.handle) {
      progressionPlayback.handle.setVolume(masterVol);
    }
    showVolume();
  }

  let volumePointerId = null;
  function setVolumeFromPointer(clientX) {
    const rect = volEl.getBoundingClientRect();
    const thumbW = volThumb.offsetWidth;
    const rangeW = rect.width - thumbW;
    setMasterVol(rangeW > 0 ? (clientX - rect.left - thumbW / 2) / rangeW : 0);
  }

  function finishVolumeDrag(event) {
    if (volumePointerId !== event.pointerId) return;
    volumePointerId = null;
    volEl.classList.remove('dragging');
    if (volEl.hasPointerCapture(event.pointerId)) {
      volEl.releasePointerCapture(event.pointerId);
    }
  }

  volEl.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    event.preventDefault();
    volumePointerId = event.pointerId;
    volEl.classList.add('dragging');
    volEl.setPointerCapture(event.pointerId);
    setVolumeFromPointer(event.clientX);
  });
  volEl.addEventListener('pointermove', (event) => {
    if (volumePointerId === event.pointerId) setVolumeFromPointer(event.clientX);
  });
  volEl.addEventListener('pointerup', finishVolumeDrag);
  volEl.addEventListener('pointercancel', finishVolumeDrag);
  volEl.addEventListener('lostpointercapture', finishVolumeDrag);
  volEl.addEventListener('keydown', (event) => {
    event.stopPropagation();
    const steps = { ArrowLeft: -0.01, ArrowDown: -0.01, ArrowRight: 0.01, ArrowUp: 0.01,
      PageDown: -0.1, PageUp: 0.1 };
    if (event.key === 'Home') setMasterVol(0);
    else if (event.key === 'End') setMasterVol(1);
    else if (Object.hasOwn(steps, event.key)) setMasterVol(masterVol + steps[event.key]);
    else return;
    event.preventDefault();
  });

  window.addEventListener('wheel', (e) => {
    if (!histPopover.hidden && histPopover.contains(e.target)) return;
    if (e.ctrlKey) return;               /* leave pinch-zoom alone */
    e.preventDefault();
    let d = e.deltaY;
    if (e.deltaMode === 1) d *= 16;      /* lines -> px */
    else if (e.deltaMode === 2) d *= window.innerHeight; /* pages -> px */
    d = clamp(d, -WHEEL_MAX_DELTA, WHEEL_MAX_DELTA);
    setMasterVol(masterVol - d * WHEEL_K);   /* scroll up = louder */
  }, { passive: false });

  updateVolumeDisplay();

  function finishClickPreview(event = null) {
    if (!clickPreview) return;
    if (event && clickPreview.pointerId != null &&
        clickPreview.pointerId !== event.pointerId) return;
    clickPreview.handle.release();
    if (clickPreview.el) clickPreview.el.classList.remove('pressed');
    clickPreview = null;
  }

  function clearLatchedChord() {
    finishClickPreview();
    if (latchedChord && latchedChord.handle) latchedChord.handle.release();
    if (latchedChord && latchedChord.el) latchedChord.el.classList.remove('pressed');
    latchedChord = null;
  }

  function setLatchedChordPlaying(shouldPlay) {
    if (!latchedChord || latchedChord.el._dying) return false;
    if (shouldPlay && !latchedChord.handle) {
      latchedChord.handle = startChord(
        latchedChord.chord.midi, latchedChord.chord.type, masterVol,
        latchedChord.chord.inversion || 0);
      latchedChord.el.classList.add('pressed');
      return true;
    } else if (!shouldPlay && latchedChord.handle) {
      latchedChord.handle.release();
      latchedChord.handle = null;
      latchedChord.el.classList.remove('pressed');
      return true;
    }
    return false;
  }

  function updateNotePlaybackButton() {
    notePlaybackToggle.setAttribute('aria-label',
      activeNotePlaybackEnabled ? 'Mute active-note playback' : 'Unmute active-note playback');
    notePlaybackToggle.setAttribute('aria-pressed', String(activeNotePlaybackEnabled));
  }

  function toggleLatchedPlayback() {
    finishClickPreview();
    if (rightPreview) finishRightPreview(true);
    if (progressionPlayback) cancelProgressionPlayback();
    activeNotePlaybackEnabled = !activeNotePlaybackEnabled;
    setLatchedChordPlaying(activeNotePlaybackEnabled);
    updateNotePlaybackButton();
  }

  function finishRightPreview(restoreLatched = true, event = null) {
    if (!rightPreview) return;
    if (event && rightPreview.pointerId !== event.pointerId) return;
    rightPreview.handle.release();
    const resumeLatched = rightPreview.resumeLatched;
    rightPreview = null;
    if (restoreLatched && resumeLatched) setLatchedChordPlaying(true);
  }

  function chordAtPoint(x, y) {
    const el = hoverColumn(x, y, tSel.el) ||
      (() => {
        const near = nearestNote(null, x, y);
        return near && near.d2 <= interactDist * interactDist ? near.el : null;
      })();
    if (!el) return null;
    const target = inWindow(el, x, y, slotW * 0.6)
      ? pickLevel(el, y, tSel)
      : 0;
    return { el, target, chord: targetsFor(el)[target] };
  }

  function latchChord(selection, event) {
    const chord = chordWithHeldInversion(selection.chord);
    if (!chord) return;
    const keepPlaying = activeNotePlaybackEnabled;
    finishRightPreview(false);
    finishClickPreview();
    if (latchedChord && latchedChord.handle) latchedChord.handle.release();
    if (latchedChord && latchedChord.el) latchedChord.el.classList.remove('pressed');
    latchedChord = null;
    latchedChord = {
      el: selection.el,
      target: selection.target,
      targetId: chord.id,
      chord,
      handle: keepPlaying
        ? startChord(chord.midi, chord.type, masterVol, chord.inversion)
        : null,
    };
    if (keepPlaying) {
      selection.el.classList.add('pressed');
    } else {
      clickPreview = {
        el: selection.el,
        pointerId: event.pointerId,
        handle: startChord(chord.midi, chord.type, masterVol, chord.inversion),
      };
      selection.el.classList.add('pressed');
    }
    pushHistory(chord, true);
  }

  function previewRightClick(selection, event) {
    const chord = chordWithHeldInversion(selection.chord);
    if (!chord) return;
    if (rightPreview && rightPreview.el === selection.el &&
        rightPreview.targetId === chord.id &&
        rightPreview.chord.inversion === chord.inversion) return;
    finishClickPreview();
    const resumeLatched = rightPreview
      ? rightPreview.resumeLatched
      : activeNotePlaybackEnabled;
    if (rightPreview) {
      rightPreview.handle.release();
      rightPreview = null;
    }
    setLatchedChordPlaying(false);
    rightPreview = {
      el: selection.el,
      target: selection.target,
      targetId: chord.id,
      chord,
      pointerId: event.pointerId,
      resumeLatched,
      handle: startChord(chord.midi, chord.type, masterVol, chord.inversion),
    };
  }

  function updateRightPreviewInversion() {
    if (!rightPreview) return;
    previewRightClick({
      el: rightPreview.el,
      target: rightPreview.target,
      chord: rightPreview.chord,
    }, { pointerId: rightPreview.pointerId });
  }

  function syncPlayingClass() {
    for (let i = 0; i < noteEls.length; i++) {
      const el = noteEls[i];
      el.classList.toggle('playing',
        !!((latchedChord && latchedChord.handle && latchedChord.el === el && !rightPreview) ||
          (clickPreview && clickPreview.el === el) ||
          (rightPreview && rightPreview.el === el)));
    }
  }

  function onPointerDown(e) {
    if (e.button !== 0 && e.button !== 1 && e.button !== 2) return;

    const tgt = e.target;
    if (!settingsPanel.hidden && !settingsPanel.contains(tgt) && !settingsToggle.contains(tgt)) {
      closeTargetSettings();
    }
    if (tgt && tgt.closest && (tgt.closest('.settings-panel') || tgt.closest('.settings-toggle') ||
        tgt.closest('.mode-picker'))) return;
    if (tgt && tgt.closest && tgt.closest('.arrow')) return;
    if (tgt && tgt.closest && (tgt.closest('.histbar') || tgt.closest('.mode-wheel') ||
        tgt.closest('.note-playback-toggle') || tgt.closest('.piano-toggle') ||
        tgt.closest('.vol'))) return;

    const touch = e.pointerType === 'touch';
    if (!touch) {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.active = true;
    }

    audio();

    if (e.button !== 2) e.preventDefault();
    if (e.button === 1) {
      toggleLatchedPlayback();
      return;
    }

    const selection = e.clientY <= cutoffY
      ? chordAtPoint(e.clientX, e.clientY)
      : null;
    if (!selection) {
      if (e.button === 2) return;
      if (progressionPlayback) cancelProgressionPlayback();
      return;
    }
    if (e.button === 2) previewRightClick(selection, e);
    else latchChord(selection, e);
  }

  function onPointerUp(e) {
    if (e && e.pointerType !== 'touch') {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    }
    finishClickPreview(e);
    finishRightPreview(true, e);
  }

  /* ---------- chord targets (shown while click-dragging) ---------- */

  const tGroup = document.getElementById('targets');
  const TARGET_DEFINITIONS = [
    { id: 'diminished', name: 'Leading-tone diminished', detail: 'vii°7 of the selected chord' },
    { id: 'tritone', name: 'Tritone substitution', detail: 'SubV7 of the selected chord' },
    { id: 'modal', name: 'Modal interchange', detail: 'Borrowed chord from the parallel scale' },
    { id: 'secondary-dominant', name: 'Secondary dominant', detail: 'V7 of the selected chord' },
    { id: 'secondary-supertonic', name: 'Secondary ii chord', detail: 'ii7 preceding the selected chord' },
    { id: 'dominant-sus', name: 'Suspended dominant', detail: 'V7sus4 of the selected chord' },
    { id: 'dominant-flat-nine', name: 'Flat-nine dominant', detail: 'V7♭9 of the selected chord' },
    { id: 'dominant-sharp-five', name: 'Sharp-five dominant', detail: 'V7♯5 of the selected chord' },
    { id: 'backdoor-dominant', name: 'Backdoor dominant', detail: '♭VII7 approach to the selected chord' },
    { id: 'dominant-sharp-nine', name: 'Sharp-nine dominant', detail: 'V7♯9 of the selected chord' },
    { id: 'dominant-flat-five', name: 'Flat-five dominant', detail: 'V7♭5 of the selected chord' },
    { id: 'minor-plagal', name: 'Minor plagal chord', detail: 'ivm7 approach to the selected chord' },
  ];
  const TARGET_DEFAULTS = ['secondary-dominant', 'modal', 'tritone', 'diminished'];
  const TARGET_SETTINGS_KEY = 'chord-explorer-target-settings-v1';
  const pianoToggleForTargets = document.getElementById('pianoToggle');
  let targetSafeTop = 24;
  const targetDefinitions = new Map(TARGET_DEFINITIONS.map((definition) =>
    [definition.id, definition]));
  let enabledTargetIds = TARGET_DEFAULTS.slice();
  try {
    const savedTargets = JSON.parse(localStorage.getItem(TARGET_SETTINGS_KEY) || 'null');
    if (Array.isArray(savedTargets) &&
        savedTargets.every((id) => typeof id === 'string' && targetDefinitions.has(id)) &&
        new Set(savedTargets).size === savedTargets.length) {
      enabledTargetIds = savedTargets;
    }
  } catch (error) {
    console.warn('Unable to load chord target settings.', error);
  }
  let tEls = [];

  function createTargetRow() {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    const name = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    const rom = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    line.setAttribute('class', 'tline');
    name.setAttribute('class', 'tname');
    name.setAttribute('text-anchor', 'middle');
    rom.setAttribute('class', 'trom');
    rom.setAttribute('text-anchor', 'middle');
    tGroup.append(line, name, rom);
    return { line, name, rom, key: '' };
  }

  function syncTargetRows() {
    while (tEls.length < enabledTargetIds.length) tEls.push(createTargetRow());
    while (tEls.length > enabledTargetIds.length) {
      const row = tEls.pop();
      row.line.remove();
      row.name.remove();
      row.rom.remove();
    }
  }

  syncTargetRows();
  let tAlpha = 0, tEl = null;

  const pcName = (midi, flats) =>
    (flats ? FLAT_N : SHARP_N)[((midi % 12) + 12) % 12];

  function targetsFor(el) {
    const slot = Number(el.dataset.slot);
    const key  = KEYS[keyIdx];
    const sp   = KEY_FLATS[keyIdx];
    const root = key.midi + scaleData.intervals[slot];
    const q    = scaleData.qualities[slot];

    const dia = { midi: root, type: q,
                  name: scaleData.notes[slot] + TYPE_SUFFIX[q],
                  roman: scaleData.labels[slot], id: 'diatonic' };

    const dominantRoot = root - 5;
    const modal = MODAL[slot % MODAL.length];
    const makeTarget = (id, midi, type, suffix, roman, flats) => ({
      id, midi, type, name: pcName(midi, flats) + suffix, roman,
    });
    const availableTargets = {
      diminished: makeTarget('diminished', root - 1, 'dim7', 'dim7',
        'vii\u00b07/' + scaleData.labels[slot], sp.ld),
      tritone: makeTarget('tritone', root + 1, 'dom7', '7',
        'subV7/' + scaleData.labels[slot], sp.ts),
      modal: {
        id: 'modal',
        midi: key.midi + modal.off,
        type: modal.type,
        name: pcName(key.midi + modal.off, sp.mi) + TYPE_SUFFIX[modal.type],
        roman: modal.roman,
      },
      'secondary-dominant': makeTarget('secondary-dominant', dominantRoot, 'dom7', '7',
        'V7/' + scaleData.labels[slot], sp.sd),
      'secondary-supertonic': makeTarget('secondary-supertonic', root - 2, 'm7', 'm7',
        'ii7/' + scaleData.labels[slot], sp.sd),
      'dominant-sus': makeTarget('dominant-sus', dominantRoot, 'dom7sus4', '7sus4',
        'V7sus4/' + scaleData.labels[slot], sp.sd),
      'dominant-flat-nine': makeTarget('dominant-flat-nine', dominantRoot, 'dom7b9', '7\u266d9',
        'V7\u266d9/' + scaleData.labels[slot], sp.sd),
      'dominant-sharp-five': makeTarget('dominant-sharp-five', dominantRoot, 'dom7sharp5', '7\u266f5',
        'V7\u266f5/' + scaleData.labels[slot], sp.sd),
      'backdoor-dominant': makeTarget('backdoor-dominant', root - 2, 'dom7', '7',
        '\u266dVII7/' + scaleData.labels[slot], true),
      'dominant-sharp-nine': makeTarget('dominant-sharp-nine', dominantRoot, 'dom7sharp9', '7\u266f9',
        'V7\u266f9/' + scaleData.labels[slot], sp.sd),
      'dominant-flat-five': makeTarget('dominant-flat-five', dominantRoot, 'dom7flat5', '7\u266d5',
        'V7\u266d5/' + scaleData.labels[slot], sp.sd),
      'minor-plagal': makeTarget('minor-plagal', root + 5, 'm7', 'm7',
        'ivm7/' + scaleData.labels[slot], sp.mi),
    };

    return [dia, ...enabledTargetIds.map((id) => availableTargets[id])];
  }

  function targetYs(y0) {
    if (enabledTargetIds.length <= 4) {
      const firstOffset = Math.max(fontSize * 1.45, 46);
      const room = y0 - 28 - firstOffset;
      const spacing = clamp(room / 3, 30, Math.max(fontSize, 38));
      return [
        y0,
        ...enabledTargetIds.map((_, index) => y0 - firstOffset - index * spacing),
      ];
    }

    const firstOffset = Math.max(fontSize * 1.45, 46);
    const available = Math.max(0, y0 - firstOffset - targetSafeTop);
    const spacing = enabledTargetIds.length > 1
      ? available / (enabledTargetIds.length - 1)
      : 0;
    return [
      y0,
      ...enabledTargetIds.map((_, index) =>
        y0 - firstOffset - spacing * index),
    ];
  }

  function updateTargetSafeTop() {
    targetSafeTop = pianoToggleForTargets.getBoundingClientRect().bottom + 38;
  }

  function targetYsFor(el) {
    return targetYs(blobCenter(el).y - el._accShift);
  }

  function pointOnChordAreaRay(originX, originY, pointerX, pointerY) {
    const bounds = notesEl.getBoundingClientRect();
    let top = bounds.top;
    for (const el of noteEls) {
      if (!el._dying && el._blob) {
        const ys = targetYsFor(el);
        top = Math.min(top, ys[ys.length - 1] - 76);
      }
    }
    const sidePadding = 24;
    const left = bounds.left - sidePadding;
    const right = bounds.right + sidePadding;
    const dx = pointerX - originX;
    const dy = pointerY - originY;
    let distance = 1;

    if (dx < 0) distance = Math.min(distance, (left - originX) / dx);
    else if (dx > 0) distance = Math.min(distance, (right - originX) / dx);
    if (dy < 0) distance = Math.min(distance, (top - originY) / dy);
    else if (dy > 0) distance = Math.min(distance, (bounds.bottom - originY) / dy);

    const x = originX + dx * distance;
    const y = originY + dy * distance;
    const outside = pointerX < left || pointerX > right ||
      pointerY < top || pointerY > bounds.bottom;
    return {
      x: outside ? x : pointerX,
      y: outside ? y : pointerY,
      outsideDistance: outside ? Math.hypot(pointerX - x, pointerY - y) : 0,
    };
  }

  const tSel = { el: null, k: 0 };   /* chord whose targets are showing + previewed target */
  const tPos = { x: 0, y: 0 };       /* smoothed anchor for the drawn lines */
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  const targetOrder = document.getElementById('targetOrder');
  const targetTypeSelect = document.getElementById('targetTypeSelect');
  const targetAddButton = document.getElementById('targetAddButton');
  const targetSettingsReset = document.getElementById('targetSettingsReset');

  function closeTargetSettings() {
    settingsPanel.hidden = true;
    settingsToggle.setAttribute('aria-expanded', 'false');
  }

  function persistTargetSettings() {
    try {
      localStorage.setItem(TARGET_SETTINGS_KEY, JSON.stringify(enabledTargetIds));
    } catch (error) {
      console.warn('Unable to save chord target settings.', error);
    }
  }

  function updateTargetSettings() {
    syncTargetRows();
    targetOrder.replaceChildren();

    for (const id of enabledTargetIds.slice().reverse()) {
      const definition = targetDefinitions.get(id);
      const row = document.createElement('div');
      row.className = 'target-order-row';
      row.dataset.targetId = id;

      const grip = document.createElement('button');
      grip.type = 'button';
      grip.className = 'target-order-grip';
      grip.setAttribute('aria-label', 'Reorder ' + definition.name + ' with arrow keys or drag');
      grip.textContent = '\u22ee\u22ee';
      grip.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
        const other = event.key === 'ArrowUp'
          ? row.previousElementSibling
          : row.nextElementSibling;
        if (!other || other.classList.contains('fixed')) return;
        if (event.key === 'ArrowUp') targetOrder.insertBefore(row, other);
        else targetOrder.insertBefore(other, row);
        commitTargetSettings();
        const movedGrip = targetOrder.querySelector(
          `.target-order-row[data-target-id="${id}"] .target-order-grip`);
        movedGrip.focus();
        event.preventDefault();
      });

      const copy = document.createElement('span');
      copy.className = 'target-order-copy';
      const name = document.createElement('span');
      name.className = 'target-order-name';
      name.textContent = definition.name;
      const detail = document.createElement('span');
      detail.className = 'target-order-detail';
      detail.textContent = definition.detail;
      copy.append(name, detail);
