      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'target-order-remove';
      remove.setAttribute('aria-label', 'Remove ' + definition.name);
      remove.textContent = '\u00d7';
      remove.addEventListener('click', () => {
        enabledTargetIds = enabledTargetIds.filter((targetId) => targetId !== id);
        commitTargetSettings();
      });

      row.append(grip, copy, remove);
      targetOrder.append(row);
    }

    const fixedRow = document.createElement('div');
    fixedRow.className = 'target-order-row fixed';
    const fixedCopy = document.createElement('span');
    fixedCopy.className = 'target-order-copy';
    const fixedName = document.createElement('span');
    fixedName.className = 'target-order-name';
    fixedName.textContent = 'Diatonic chord';
    const fixedDetail = document.createElement('span');
    fixedDetail.className = 'target-order-detail';
    fixedDetail.textContent = 'Main chord in the current key';
    fixedCopy.append(fixedName, fixedDetail);
    fixedRow.append(document.createElement('span'), fixedCopy);
    targetOrder.append(fixedRow);

    const unusedTargets = TARGET_DEFINITIONS.filter((definition) =>
      !enabledTargetIds.includes(definition.id));
    targetTypeSelect.replaceChildren(...unusedTargets.map((definition) => {
      const option = document.createElement('option');
      option.value = definition.id;
      option.textContent = definition.name;
      return option;
    }));
    targetAddButton.disabled = unusedTargets.length === 0;
  }

  function commitTargetSettings() {
    persistTargetSettings();
    updateTargetSettings();
    tSel.el = null;
    tSel.k = 0;
    tEls.forEach((row) => { row.key = ''; });
  }

  targetAddButton.addEventListener('click', () => {
    const id = targetTypeSelect.value;
    if (!targetDefinitions.has(id) || enabledTargetIds.includes(id)) return;
    enabledTargetIds.push(id);
    commitTargetSettings();
  });
  targetSettingsReset.addEventListener('click', () => {
    enabledTargetIds = TARGET_DEFAULTS.slice();
    commitTargetSettings();
  });

  targetOrder.addEventListener('pointerdown', (event) => {
    const grip = event.target.closest('.target-order-grip');
    if (!grip || event.button !== 0) return;
    const row = grip.closest('.target-order-row');
    row.classList.add('dragging');
    targetOrder.setPointerCapture(event.pointerId);
    targetOrder._draggedRow = row;
    event.preventDefault();
  });
  targetOrder.addEventListener('pointermove', (event) => {
    const draggedRow = targetOrder._draggedRow;
    if (!draggedRow || !targetOrder.hasPointerCapture(event.pointerId)) return;
    const rows = [...targetOrder.querySelectorAll('.target-order-row:not(.fixed)')]
      .filter((row) => row !== draggedRow);
    const before = rows.find((row) => event.clientY < row.getBoundingClientRect().top +
      row.getBoundingClientRect().height / 2);
    const fixedRow = targetOrder.querySelector('.target-order-row.fixed');
    targetOrder.insertBefore(draggedRow, before || fixedRow);
  });
  function finishTargetReorder(event) {
    const draggedRow = targetOrder._draggedRow;
    if (!draggedRow || !targetOrder.hasPointerCapture(event.pointerId)) return;
    draggedRow.classList.remove('dragging');
    targetOrder._draggedRow = null;
    enabledTargetIds = [...targetOrder.querySelectorAll('.target-order-row:not(.fixed)')]
      .map((row) => row.dataset.targetId).reverse();
    commitTargetSettings();
  }
  targetOrder.addEventListener('pointerup', finishTargetReorder);
  targetOrder.addEventListener('pointercancel', finishTargetReorder);
  targetOrder.addEventListener('lostpointercapture', finishTargetReorder);
  settingsToggle.addEventListener('click', () => {
    const opening = settingsPanel.hidden;
    settingsPanel.hidden = !opening;
    settingsToggle.setAttribute('aria-expanded', String(opening));
    if (opening) targetTypeSelect.focus();
  });
  settingsPanel.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      closeTargetSettings();
      settingsToggle.focus();
    }
  });

  updateTargetSettings();


  function chordForNote(el, target = 0) {
    if (target > 0) return targetsFor(el)[target];
    const slot = Number(el.dataset.slot);
    const quality = scaleData.qualities[slot];
    return {
      midi: KEYS[keyIdx].midi + scaleData.intervals[slot],
      type: quality,
      name: scaleData.notes[slot] + TYPE_SUFFIX[quality],
      id: 'diatonic',
    };
  }

  /* is the pointer inside the chord's column, from well below it
     up past the top target line? */
  function inWindow(el, px, py, halfW) {
    if (!el._blob) return false;
    const c  = blobCenter(el);
    const ys = targetYs(c.y - el._accShift);
    return Math.abs(px - c.x) <= halfW && py >= ys[ys.length - 1] - 28 && py <= Math.min(c.y + interactDist, cutoffY);
  }

  /* which chord's column is the pointer over (with a little stickiness) */
  function hoverColumn(px, py, cur) {
    if (cur && !cur._dying && inWindow(cur, px, py, slotW * 0.5 + 8)) return cur;
    let best = null, bd = Infinity;
    for (let i = 0; i < noteEls.length; i++) {
      const el = noteEls[i];
      if (el._dying || !el._blob) continue;
      const dx = Math.abs(px - blobCenter(el).x);
      if (dx < bd) { bd = dx; best = el; }
    }
    return best && inWindow(best, px, py, slotW * 0.6) ? best : null;
  }

  /* which of the three levels (0 diatonic, 1 sec. dominant, 2 modal) the
     pointer height is on, with a little stickiness */
  function pickLevel(el, py, prev) {
    const ys = targetYsFor(el);
    let best = 0, bd = Infinity;
    for (let i = 0; i < ys.length; i++) {
      const d = Math.abs(py - ys[i]);
      if (d < bd) { bd = d; best = i; }
    }
    if (el === prev.el && best !== prev.k &&
        bd > Math.abs(py - ys[prev.k]) - T_HYST) return prev.k;
    return best;
  }

  /* decide which chord's targets are showing and which one is selected */
  function computeSel() {
    let selEl = null, k = 0;
    if (pointer.active) {
      selEl = hoverColumn(pointer.x, pointer.y, tSel.el);
      if (selEl) k = pickLevel(selEl, pointer.y, tSel);
    }

    tSel.el = selEl;
    tSel.k  = k;
  }

  function placeLine(t, x, y, halfW, nameFs, romFs) {
    t.line.setAttribute('x1', (x - halfW).toFixed(1));
    t.line.setAttribute('x2', (x + halfW).toFixed(1));
    t.line.setAttribute('y1', y.toFixed(1));
    t.line.setAttribute('y2', y.toFixed(1));

    t.rom.setAttribute('x', x.toFixed(1));
    t.rom.setAttribute('y', (y - 5).toFixed(1));
    t.rom.setAttribute('font-size', romFs.toFixed(1));

    t.name.setAttribute('x', x.toFixed(1));
    t.name.setAttribute('y', (y - 5 - romFs - 3).toFixed(1));
    t.name.setAttribute('font-size', nameFs.toFixed(1));
  }

  function setLabel(t, ch) {
    const key = ch.name + '|' + ch.roman;
    if (t.key === key) return;
    t.key = key;
    t.name.textContent = ch.name;
    t.rom.textContent  = ch.roman;
  }

  const pGroup = document.getElementById('tpin');
  const pLine  = {
    line: document.getElementById('tlp'),
    name: document.getElementById('tnp'),
    rom:  document.getElementById('trp'),
    key:  '',
  };
  let pAlpha = 0, pEl = null, pK = 0;

  /* the metaball's chord side for a target: hugs the drawn label */
  function labelBlob(t) {
    const a = t.name.getBoundingClientRect();
    const b = t.rom.getBoundingClientRect();
    if (!a.width || !b.width) return null;

    const left   = Math.min(a.left,   b.left);
    const right  = Math.max(a.right,  b.right);
    const top    = Math.min(a.top,    b.top);
    const bottom = Math.max(a.bottom, b.bottom);

    const pad = fontSize * 0.2;
    const r   = Math.min(Math.max((right - left) / 2, (bottom - top) / 2) + pad,
                         slotW * 0.6);
    return { x: (left + right) / 2, y: (top + bottom) / 2, r };
  }

  function targetIndexFor(chord) {
    if (!chord || chord.targetId === 'diatonic') return 0;
    const index = enabledTargetIds.indexOf(chord.targetId);
    return index < 0 ? 0 : index + 1;
  }

  /* blob anchor for target k of chord el, if its label is currently drawn */
  function targetBlob(el, k) {
    if (tEl === el && tAlpha > 0 && k >= 1 && k <= tEls.length) return labelBlob(tEls[k - 1]);
    if (pEl === el && pK === k && pAlpha > 0)         return labelBlob(pLine);
    return null;
  }

  function drawTargets(dt) {
    const selEl = tSel.el, k = tSel.k;

    /* ---- lines on the hovered chord ---- */
    if (selEl) {
      const c = blobCenter(selEl);
      const targetY = c.y - selEl._accShift;
      if (tAlpha < 0.02 || !tEl) {
        tPos.x = c.x; tPos.y = targetY;
      } else {
        const a = 1 - Math.exp(-dt / 60);
        tPos.x += (c.x - tPos.x) * a;
        tPos.y += (targetY - tPos.y) * a;
      }
      tEl = selEl;
    }

    tAlpha += ((selEl ? 1 : 0) - tAlpha) * (1 - Math.exp(-dt / 110));
    if (tAlpha < 0.004) tAlpha = 0;

    const targetPositions = targetYs(tPos.y);
    const targetSpacing = enabledTargetIds.length > 4
      ? Math.max(0, targetPositions[1] - (targetPositions[2] ?? targetPositions[1]))
      : Math.max(fontSize, 38);
    const compactScale = enabledTargetIds.length <= 4
      ? 1
      : clamp(targetSpacing / 30, 0.65, 1);
    const nameFs = Math.max(fontSize * 0.34, 11) * compactScale;
    const romFs  = Math.max(fontSize * 0.2, 8.5) * compactScale;
    const halfW  = slotW * 0.42;

    if (!tEl || tEl._dying || !tEl._blob) {
      tAlpha = 0;
      tGroup.style.opacity = '0';
    } else {
      tGroup.style.opacity = tAlpha.toFixed(3);
      if (tAlpha) {
        const ys     = targetYs(tPos.y);
        const chords = targetsFor(tEl);
        const heldK = latchedChord && latchedChord.el === tEl
          ? targetIndexFor(latchedChord)
          : 0;

        for (let i = 0; i < tEls.length; i++) {
          const t  = tEls[i];
          const on = !!(selEl && k === i + 1);
          const hl = heldK === i + 1;

          setLabel(t, chords[i + 1]);
          placeLine(t, tPos.x, ys[i + 1], halfW, nameFs, romFs);

          t.line.classList.toggle('latched', hl);
          t.line.classList.toggle('on', on);
          t.name.classList.toggle('on', on || hl);
          t.rom.classList.toggle('on', on || hl);
        }
      }
    }

    /* ---- keep a latched target chord's line on screen while pointer moves away ---- */
    const activeChord = rightPreview || latchedChord;
    const pinnedChord = activeChord && targetIndexFor(activeChord) > 0 ? activeChord : null;
    const pinnedTargetIndex = targetIndexFor(pinnedChord);
    const pin = !!(pinnedChord && !pinnedChord.el._dying && pinnedChord.el._blob &&
                   pinnedTargetIndex > 0 && selEl !== pinnedChord.el);
    if (pin) { pEl = pinnedChord.el; pK = pinnedTargetIndex; }

    pAlpha += ((pin ? 1 : 0) - pAlpha) * (1 - Math.exp(-dt / 110));
    if (pAlpha < 0.004) pAlpha = 0;

    if (!pEl || pEl._dying || !pEl._blob) {
      pAlpha = 0;
      pGroup.style.opacity = '0';
    } else {
      pGroup.style.opacity = pAlpha.toFixed(3);
      if (pAlpha) {
        const c  = blobCenter(pEl);
        const ys = targetYsFor(pEl);
        setLabel(pLine, targetsFor(pEl)[pK]);
        placeLine(pLine, c.x, ys[pK], halfW, nameFs, romFs);
      }
    }
  }

  /* ---------- chord history ---------- */

  const SAVED_HIST_MAX    = 50;
  const HIST_IDLE_MS      = 3000;
  const HIST_CLEAR_ANIM_MS = 600;
  const HIST_STORAGE_KEY  = 'chordExplorer.progressions.v1';
  const HIST_RECOVERY_KEY = 'chordExplorer.progressionRecovery.v1';
  const PLAY_BEAT_MS      = 500;

  const histBar      = document.getElementById('histBar');
  const hist         = document.getElementById('hist');
  const histTrack    = document.getElementById('histTrack');
  const histClear    = document.getElementById('histClear');
  const histCopy     = document.getElementById('histCopy');
  const histCopyWrap = document.getElementById('histCopyWrap');
  const histCopyKey  = document.getElementById('histCopyKey');
  const histCopyDegree = document.getElementById('histCopyDegree');
  const histExport   = document.getElementById('histExport');
  const histExportWrap = document.getElementById('histExportWrap');
  const histExportMenu = document.getElementById('histExportMenu');
  const histExportMidi = document.getElementById('histExportMidi');
  const histExportWav  = document.getElementById('histExportWav');
  const histSave     = document.getElementById('histSave');
  const histArchive  = document.getElementById('histArchive');
  const histPlay     = document.getElementById('histPlay');
  const notePlaybackToggle = document.getElementById('notePlaybackToggle');
  const histPopover  = document.getElementById('histPopover');
  const histStatus   = document.getElementById('histStatus');
  let histEntries    = [];
  let histCursor     = null;
  let histLast       = '', histLastT = 0;
  let histActiveT    = -1e9;
  let histHover      = false;
  let histFocus      = false;
  let histClearT     = 0;
  let histStatusT    = 0;
  let savedProgressions = [];
  let recoveryProgression = null;
  let currentProgressionSaved = false;
  let progressionPlayback = null;
  const pianoIndicator = document.getElementById('pianoIndicator');
  const pianoToggle = document.getElementById('pianoToggle');
  const pianoCaption = document.getElementById('pianoCaption');
  const pianoKeys = Array.from(document.querySelectorAll('#pianoKeys [data-pc]'));
  const inversionIndicator = document.getElementById('inversionIndicator');
  const inversionOptions = Array.from(
    inversionIndicator.querySelectorAll('[data-inversion]'));
  const heldInversionKeys = new Set();
  let pianoChordSignature = '';

  function inversionLabel(number) {
    const ordinal = ['1st', '2nd', '3rd'][number - 1];
    return `${ordinal} inversion`;
  }

  function updateInversionIndicator() {
    const activeKey = Array.from(heldInversionKeys).pop();
    heldInversion = activeKey === undefined ? null : Number(activeKey);
    const visible = heldInversion !== null;
    inversionIndicator.classList.toggle('visible', visible);
    inversionIndicator.setAttribute('aria-hidden', String(!visible));
    inversionIndicator.setAttribute('aria-label', visible
      ? `${inversionLabel(heldInversion)} selected`
      : 'Chord inversion shortcuts');
    for (const option of inversionOptions) {
      const selected = Number(option.dataset.inversion) === heldInversion;
      option.classList.toggle('selected', selected);
      if (selected) option.setAttribute('aria-current', 'true');
      else option.removeAttribute('aria-current');
    }
  }

  function chordWithHeldInversion(chord) {
    const inversion = heldInversion === null ? 0 : heldInversion;
    const voiceCount = (CHORD_TYPES[chord.type] || CHORD_TYPES.maj).length;
    if (inversion >= voiceCount) {
      showHistStatus(
        `${inversionLabel(heldInversion)} is unavailable for ${chord.name} (${voiceCount}-note chord).`,
        true);
      return null;
    }
    return { ...chord, inversion };
  }

  pianoToggle.addEventListener('click', () => {
    const collapsed = pianoIndicator.classList.toggle('collapsed');
    pianoToggle.classList.toggle('collapsed', collapsed);
    pianoToggle.setAttribute('aria-expanded', String(!collapsed));
    pianoToggle.setAttribute('aria-label',
      collapsed ? 'Show piano chord indicator' : 'Hide piano chord indicator');
  });

  function updatePianoIndicator() {
    let chord = null;
    if (progressionPlayback && progressionPlayback.handle) {
      chord = progressionPlayback.chords[progressionPlayback.index - 1];
    } else if (rightPreview) {
      chord = rightPreview.chord;
    } else if (tSel.el && !tSel.el._dying) {
      chord = chordForNote(tSel.el, tSel.k);
    } else if (latchedChord && !latchedChord.el._dying) {
      chord = latchedChord.chord;
    } else {
      chord = chordForNote(noteEls[0]);
    }

    const name = chord.type === 'maj'
      ? `${chord.name || pcName(chord.midi, false)} major`
      : chord.name || `${pcName(chord.midi, false)}${TYPE_SUFFIX[chord.type] || ''}`;
    const signature = `${chord.midi % 12}:${chord.type}:${name}`;
    if (signature === pianoChordSignature) return;
    pianoChordSignature = signature;
    pianoCaption.textContent = name;
    pianoIndicator.setAttribute('aria-label', `${name} chord shown on piano keys`);

    const root = ((chord.midi % 12) + 12) % 12;
    const tones = new Set((CHORD_TYPES[chord.type] || CHORD_TYPES.maj)
      .map((interval) => (root + interval) % 12));
    for (const key of pianoKeys) {
      const pitch = Number(key.dataset.pc);
      key.classList.toggle('selected', tones.has(pitch));
      key.classList.toggle('root', pitch === root);
    }
  }

  function showHistStatus(message, isError) {
    histStatus.textContent = message;
    histStatus.classList.toggle('visible', !!message);
    histStatus.classList.toggle('error', !!isError);
    clearTimeout(histStatusT);
    if (message) histStatusT = setTimeout(() => {
      histStatus.textContent = '';
      histStatus.classList.remove('visible', 'error');
    }, 3500);
  }

  function closeArchive() {
    histPopover.hidden = true;
    histBar.classList.remove('tools-open');
    histArchive.setAttribute('aria-expanded', 'false');
    if (histEntries.length) histActiveT = performance.now();
  }

  function isHistoryInteracting() {
    return histHover || histFocus || histCursor !== null || !histPopover.hidden || !!progressionPlayback;
  }

  function cancelHistoryClear() {
    if (histClearT) {
      clearTimeout(histClearT);
      histClearT = 0;
      histTrack.classList.remove('idle-clearing');
    }
  }

  function renderHistory(popIndex = null) {
    histBar.classList.toggle('has-progression', histEntries.length > 0);
    histTrack.textContent = '';
    const caret = document.createElement('span');
    caret.className = 'hist-caret';
    histEntries.forEach((chord, i) => {
      if (histCursor === i) histTrack.appendChild(caret);
      if (i) histTrack.appendChild(document.createTextNode(' '));
      const item = document.createElement('span');
      item.className = 'hist-item' + (i ? ' later' : '') +
        (popIndex === null || popIndex === i ? ' pop' : '');
      item.textContent = chord.name;
      appendInversionMarker(item, chord);
      histTrack.appendChild(item);
    });
    if (histCursor === histEntries.length) histTrack.appendChild(caret);
    hist.classList.toggle('editing', histCursor !== null);
    hist.setAttribute('aria-label',
      `Chord progression editor, ${histEntries.length} chords. Click to place the cursor; use left and right arrows to move and Backspace to delete.`);
  }

  function appendInversionMarker(item, chord) {
    const inversion = chord.inversion || 0;
    if (!inversion) return;
    const marker = document.createElement('sup');
    marker.className = 'hist-inversion';
    marker.textContent = String(inversion);
    marker.title = `${inversionLabel(inversion)}`;
    marker.setAttribute('aria-label', `${inversionLabel(inversion)}`);
    item.appendChild(marker);
  }

  function progressionText(chords, format = 'key') {
    return chords.map((chord) =>
      format === 'degree' ? (chord.roman || chord.name) : chord.name).join(' ');
  }

  function sameProgression(a, b) {
    return a.length === b.length && a.every((chord, i) =>
      chord.name === b[i].name && chord.midi === b[i].midi && chord.type === b[i].type &&
      (chord.inversion || 0) === (b[i].inversion || 0) &&
      (chord.roman || chord.name) === (b[i].roman || b[i].name));
  }

  function saveClearedProgression() {
    if (!histEntries.length || currentProgressionSaved) return;
    recoveryProgression = {
      timestamp: Date.now(),
      chords: histEntries.map((chord) => ({ ...chord })),
    };
    renderArchive();
    try {
      localStorage.setItem(HIST_RECOVERY_KEY, JSON.stringify(recoveryProgression));
    } catch (error) {
      console.error('Unable to save the recoverable chord progression.', error);
      showHistStatus('Could not save the recoverable progression in this browser.', true);
    }
  }

  function clearHistory() {
    histClearT = 0;
    cancelProgressionPlayback();
    saveClearedProgression();
    histEntries = [];
    histCursor = null;
    hist.classList.remove('editing');
    histLast = '';
    histLastT = 0;
    currentProgressionSaved = false;
    histActiveT = -1e9;
    histBar.classList.remove('tools-open');
    if (histBar.contains(document.activeElement)) document.activeElement.blur();
    renderHistory(-1);
    histTrack.style.transition = 'none';
    histTrack.style.transform = 'translateX(0px)';
    histTrack.getBoundingClientRect();
    histTrack.style.transition = '';
    histTrack.classList.remove('idle-clearing');
  }

  function cancelProgressionPlayback() {
    if (!progressionPlayback) return;
    clearTimeout(progressionPlayback.timer);
    if (progressionPlayback.handle) progressionPlayback.handle.release();
    const activeItem = progressionPlayback.items[progressionPlayback.index - 1];
    if (activeItem) activeItem.classList.remove('active');
    if (progressionPlayback.button) {
      progressionPlayback.button.textContent = 'play';
      progressionPlayback.button.setAttribute('aria-label',
        progressionPlayback.button === histPlay ? 'Play current progression' : 'Play this progression');
    }
    progressionPlayback = null;
    hist.classList.remove('playing');
  }

  function pauseProgressionPlaybackForModePicker() {
    const state = progressionPlayback;
    if (!state || state.pausedByModePicker) return null;
    clearTimeout(state.timer);
    state.timer = 0;
    state.remainingMs = Math.max(0, state.nextAt - performance.now());
    state.pausedByModePicker = true;
    return state;
  }

  function resumeProgressionPlaybackAfterModePicker(state) {
    if (!state || progressionPlayback !== state || !state.pausedByModePicker) return;
    state.pausedByModePicker = false;
    const delay = state.remainingMs ?? PLAY_BEAT_MS;
    state.nextAt = performance.now() + delay;
    state.timer = setTimeout(state.advance, delay);
  }

  function startProgressionPlayback(chords, items, button) {
    cancelProgressionPlayback();
    audio();
    finishClickPreview();
    finishRightPreview(false);
    setLatchedChordPlaying(false);
    const state = {
      chords: chords.map((chord) => ({ ...chord })),
      items: items || [],
      button: button || null,
      index: 0,
      handle: null,
      timer: 0,
      nextAt: 0,
      remainingMs: PLAY_BEAT_MS,
      pausedByModePicker: false,
      advance: null,
    };
    progressionPlayback = state;
    hist.classList.add('playing');
    if (button) {
      button.textContent = 'stop';
      button.setAttribute('aria-label',
        button === histPlay ? 'Stop current progression playback' : 'Stop this progression');
    }

    function advance() {
      if (progressionPlayback !== state || state.pausedByModePicker) return;
      if (state.handle) {
        state.handle.release();
        state.handle = null;
      }
      const previousItem = state.items[state.index - 1];
      if (previousItem) {
        previousItem.classList.remove('active');
      }
      if (state.index >= state.chords.length) {
        progressionPlayback = null;
        hist.classList.remove('playing');
        if (!state.button) {
          showHistStatus('Progression playback finished.');
        } else {
          state.button.textContent = 'play';
          state.button.setAttribute('aria-label',
            state.button === histPlay ? 'Play current progression' : 'Play this progression');
        }
        return;
      }
      const chord = state.chords[state.index++];
      state.handle = startChord(chord.midi, chord.type, masterVol, chord.inversion || 0);
      const activeItem = state.items[state.index - 1];
      if (activeItem) activeItem.classList.add('active');
      state.nextAt = performance.now() + PLAY_BEAT_MS;
      state.timer = setTimeout(advance, PLAY_BEAT_MS);
    }

    state.advance = advance;
    advance();
  }

  function playProgression() {
    if (progressionPlayback) {
      cancelProgressionPlayback();
      showHistStatus('Progression playback stopped.');
      return;
    }
    if (!histEntries.length) {
      showHistStatus('Play some chords before starting playback.', true);
      return;
    }
    startProgressionPlayback(histEntries, Array.from(histTrack.querySelectorAll('.hist-item')), histPlay);
  }

  function beginHistoryClear(now) {
    if (histClearT || !histEntries.length || isHistoryInteracting()) return;
    if (now - histActiveT <= HIST_IDLE_MS) return;
    histTrack.classList.add('idle-clearing');
    histClearT = setTimeout(clearHistory, HIST_CLEAR_ANIM_MS);
  }

  function pushHistory(chord, force = false) {
    const now = performance.now();
    cancelProgressionPlayback();
    cancelHistoryClear();
    histActiveT = now;

    /* Ignore an immediate duplicate retrigger, not a repeated chord later. */
    if (!force && histCursor === null && chord.name === histLast &&
        (chord.inversion || 0) === (histEntries.length ? histEntries[histEntries.length - 1].inversion || 0 : 0) &&
        now - histLastT < 400) {
      histLastT = now;
      return;
    }
    histLast  = chord.name;
    histLastT = now;

    const entry = {
      name: chord.name,
      midi: chord.midi,
      type: chord.type,
      roman: chord.roman,
      inversion: chord.inversion || 0,
    };
    currentProgressionSaved = false;
    const insertAt = histCursor === null ? histEntries.length : histCursor;
    histEntries.splice(insertAt, 0, entry);
    if (histCursor !== null) {
      histCursor = insertAt + 1;
    }
    renderHistory(insertAt);
  }

  function placeHistoryCursor(clientX) {
    const items = Array.from(histTrack.querySelectorAll('.hist-item'));
    histCursor = items.findIndex((item) => {
      const rect = item.getBoundingClientRect();
      return clientX < rect.left + rect.width / 2;
    });
    if (histCursor < 0) histCursor = histEntries.length;
    cancelProgressionPlayback();
    cancelHistoryClear();
    histActiveT = performance.now();
    renderHistory(-1);
    hist.focus({ preventScroll: true });
  }

  function exitHistoryEditing() {
    if (histCursor === null) return;
    histCursor = null;
    histLast = '';
    histLastT = 0;
    histActiveT = performance.now();
    renderHistory(-1);
  }

  function editHistoryFromKey(event) {
    if (histCursor === null || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      exitHistoryEditing();
    } else if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      const step = event.key === 'ArrowLeft' ? -1 : 1;
      histCursor = Math.max(0, Math.min(histEntries.length, histCursor + step));
      histActiveT = performance.now();
      renderHistory(-1);
    } else if (event.key === 'Backspace' && histCursor > 0) {
      event.preventDefault();
      cancelProgressionPlayback();
      cancelHistoryClear();
      histEntries.splice(histCursor - 1, 1);
      histCursor--;
      currentProgressionSaved = false;
      histLast = '';
      histLastT = 0;
      histActiveT = performance.now();
      renderHistory(-1);
    } else if (event.key === 'Backspace') {
      event.preventDefault();
    }
  }

  function restoreProgression(progression, isSaved) {
    cancelHistoryClear();
    cancelProgressionPlayback();
    histEntries = progression.chords.map((chord) => ({ ...chord }));
    histCursor = null;
    histLast = '';
    histLastT = 0;
    currentProgressionSaved = isSaved;
    histActiveT = performance.now();
    renderHistory();
    closeArchive();
    showHistStatus('Progression restored.');
  }

  function appendArchiveEntry(progression, label, isSaved) {
    const row = document.createElement('div');
    row.className = 'hist-entry';
    const date = document.createElement('span');
    date.className = 'hist-entry-date';
    date.textContent = label + ' · ' + new Date(progression.timestamp).toLocaleString();
    const actions = document.createElement('span');
    actions.className = 'hist-entry-actions';
    const load = document.createElement('button');
    load.className = 'hist-entry-action';
    load.type = 'button';
    load.textContent = 'load';
    load.setAttribute('aria-label', 'Load this progression');
    load.addEventListener('click', () => restoreProgression(progression, isSaved));
    const play = document.createElement('button');
    play.className = 'hist-entry-action';
    play.type = 'button';
    play.textContent = 'play';
    play.setAttribute('aria-label', 'Play this progression');
    play.addEventListener('click', () => {
      if (progressionPlayback && progressionPlayback.button === play) {
        cancelProgressionPlayback();
        return;
      }
      const chordItems = Array.from(chords.querySelectorAll('.hist-item'));
      startProgressionPlayback(progression.chords, chordItems, play);
    });
    const remove = document.createElement('button');
    remove.className = 'hist-entry-action';
    remove.type = 'button';
    remove.textContent = 'delete';
    remove.setAttribute('aria-label', 'Delete this progression from history');
    remove.addEventListener('click', () => deleteArchiveEntry(progression, isSaved));
    actions.append(load, play, remove);
    const head = document.createElement('div');
    head.className = 'hist-entry-head';
    head.append(date, actions);
    const chords = document.createElement('button');
    chords.className = 'hist-entry-chords';
    chords.type = 'button';
    chords.setAttribute('aria-label', 'Restore progression: ' + progressionText(progression.chords));
    progression.chords.forEach((chord, index) => {
      if (index) chords.appendChild(document.createTextNode(' '));
      const item = document.createElement('span');
      item.className = 'hist-item';
      item.textContent = chord.name;
      appendInversionMarker(item, chord);
      chords.appendChild(item);
    });
    chords.addEventListener('click', () => restoreProgression(progression, isSaved));
    row.append(head, chords);
    histPopover.appendChild(row);
  }

  function deleteArchiveEntry(progression, isSaved) {
    if (isSaved) {
      const index = savedProgressions.indexOf(progression);
      if (index < 0) return;
      const nextSaved = savedProgressions.filter((_, i) => i !== index);
      try {
        localStorage.setItem(HIST_STORAGE_KEY, JSON.stringify(nextSaved));
      } catch (error) {
        console.error('Unable to delete saved chord progression.', error);
        showHistStatus('Could not delete the saved progression.', true);
        return;
      }
      savedProgressions = nextSaved;
    } else {
      try {
        localStorage.removeItem(HIST_RECOVERY_KEY);
      } catch (error) {
        console.error('Unable to delete recoverable chord progression.', error);
        showHistStatus('Could not delete the recoverable progression.', true);
        return;
      }
      recoveryProgression = null;
    }
    if (progressionPlayback && sameProgression(progressionPlayback.chords, progression.chords)) {
      cancelProgressionPlayback();
    }
    renderArchive();
  }

  function clearArchive() {
    try {
      localStorage.setItem(HIST_STORAGE_KEY, '[]');
      localStorage.removeItem(HIST_RECOVERY_KEY);
    } catch (error) {
      console.error('Unable to clear saved progression history.', error);
      showHistStatus('Could not clear all saved progressions.', true);
      loadArchive();
      return;
    }
    savedProgressions = [];
    recoveryProgression = null;
    if (progressionPlayback && progressionPlayback.button) cancelProgressionPlayback();
    renderArchive();
    showHistStatus('Saved progression history cleared.');
  }

  function positionArchivePopover() {
    if (histPopover.hidden) return;
    const rect = histBar.getBoundingClientRect();
    const below = window.innerHeight - rect.bottom - 8;
    const above = rect.top - 8;
    const preferBelow = below >= Math.min(220, window.innerHeight * 0.4) || below >= above;
    histPopover.style.left = '50%';
    histPopover.style.maxHeight = Math.max(0, preferBelow ? below : above) + 'px';
    if (preferBelow) {
      histPopover.style.top = (rect.bottom + 8) + 'px';
      histPopover.style.bottom = 'auto';
    } else {
      histPopover.style.top = 'auto';
      histPopover.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
    }
  }

  function renderArchive() {
    histPopover.textContent = '';
    const clearAll = document.createElement('button');
    clearAll.className = 'hist-clear-all';
    clearAll.type = 'button';
    clearAll.textContent = 'clear all';
    clearAll.disabled = !recoveryProgression && !savedProgressions.length;
    clearAll.addEventListener('click', clearArchive);
    histPopover.appendChild(clearAll);

    if (recoveryProgression) {
      appendArchiveEntry(recoveryProgression, 'Recoverable', false);
    }
    if (savedProgressions.length) {
      const heading = document.createElement('div');
      heading.className = 'hist-entry-date hist-section-title';
      heading.textContent = 'Saved progressions';
      histPopover.appendChild(heading);
    }
    savedProgressions.forEach((progression) => {
      appendArchiveEntry(progression, 'Saved', true);
    });
    if (!recoveryProgression && !savedProgressions.length) {
      const empty = document.createElement('div');
      empty.className = 'hist-entry hist-entry-date';
      empty.textContent = 'No saved progressions';
      histPopover.appendChild(empty);
    }
  }

  function saveCurrentProgression() {
    if (!histEntries.length) {
      showHistStatus('Play some chords before saving.', true);
      return;
    }
    if (currentProgressionSaved) {
      showHistStatus('This progression is already saved.');
      return;
    }

    const saved = {
      timestamp: Date.now(),
      chords: histEntries.map((chord) => ({ ...chord })),
    };
    const nextSaved = [saved, ...savedProgressions].slice(0, SAVED_HIST_MAX);
    try {
      localStorage.setItem(HIST_STORAGE_KEY, JSON.stringify(nextSaved));
      savedProgressions = nextSaved;
    } catch (error) {
      console.error('Unable to save chord progression.', error);
      showHistStatus('Could not save the progression in this browser.', true);
      return;
    }

    currentProgressionSaved = true;
    let recoveryRemoved = true;
    if (recoveryProgression && sameProgression(recoveryProgression.chords, histEntries)) {
      try {
        localStorage.removeItem(HIST_RECOVERY_KEY);
        recoveryProgression = null;
      } catch (error) {
        recoveryRemoved = false;
        console.error('Unable to remove the redundant recoverable progression.', error);
        showHistStatus('Saved the progression, but its recovery copy could not be removed.', true);
      }
    }
    renderArchive();
    if (recoveryRemoved) showHistStatus('Progression saved.');
  }

  function isValidProgression(progression) {
    return progression && Number.isFinite(progression.timestamp) &&
      Array.isArray(progression.chords) && progression.chords.length > 0 &&
      progression.chords.every((chord) =>
        chord && typeof chord.name === 'string' &&
        Number.isInteger(chord.midi) && chord.midi >= 0 && chord.midi <= 127 &&
        Object.prototype.hasOwnProperty.call(CHORD_TYPES, chord.type) &&
        (chord.inversion === undefined ||
          (Number.isInteger(chord.inversion) && chord.inversion >= 0 &&
            chord.inversion < CHORD_TYPES[chord.type].length)) &&
        (chord.roman === undefined || typeof chord.roman === 'string'));
  }

  function loadArchive() {
    try {
      const stored = JSON.parse(localStorage.getItem(HIST_STORAGE_KEY) || '[]');
      if (!Array.isArray(stored)) throw new TypeError('Saved progression history is not a list.');
      savedProgressions = stored.filter(isValidProgression).slice(0, SAVED_HIST_MAX);
      const recovery = JSON.parse(localStorage.getItem(HIST_RECOVERY_KEY) || 'null');
      recoveryProgression = isValidProgression(recovery) ? recovery : null;
    } catch (error) {
      console.error('Unable to load chord progression history.', error);
      savedProgressions = [];
      recoveryProgression = null;
      showHistStatus('Could not load saved progression history in this browser.', true);
    }
    renderArchive();
  }

  function encodeVariableLength(value) {
    let buffer = value & 0x7f;
    const bytes = [];
    while ((value >>= 7)) {
      buffer <<= 8;
      buffer |= (value & 0x7f) | 0x80;
    }
    while (true) {
      bytes.push(buffer & 0xff);
      if (buffer & 0x80) buffer >>= 8;
      else break;
    }
    return bytes;
  }

  function exportMidi() {
    if (!histEntries.length) {
      showHistStatus('Play some chords before exporting.', true);
      return;
    }

    let url = '';
    try {
      const ticksPerBeat = 480;
      const ticksPerChord = ticksPerBeat * 4;
      const events = [];
      histEntries.forEach((chord, index) => {
        const start = index * ticksPerChord;
        const end = start + ticksPerChord;
        const pitches = chordVoicing(chord.type, chord.inversion || 0)
          .map((part) => chord.midi + part.semitones);
        pitches.forEach((pitch) => {
          const note = clamp(pitch, 0, 127);
          events.push({ tick: start, order: 1, bytes: [0x90, note, 88] });
          events.push({ tick: end, order: 0, bytes: [0x80, note, 64] });
        });
      });
      events.sort((a, b) => a.tick - b.tick || a.order - b.order);

      const track = [
        0x00, 0xff, 0x51, 0x03, 0x07, 0xa1, 0x20,
        0x00, 0xff, 0x58, 0x04, 0x04, 0x02, 0x18, 0x08,
        0x00, 0xc0, 0x00,
      ];
      let lastTick = 0;
      events.forEach((event) => {
        track.push(...encodeVariableLength(event.tick - lastTick), ...event.bytes);
        lastTick = event.tick;
      });
      track.push(...encodeVariableLength(histEntries.length * ticksPerChord - lastTick), 0xff, 0x2f, 0x00);

      const header = [
        0x4d, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06,
        0x00, 0x00, 0x00, 0x01, 0x01, 0xe0,
        0x4d, 0x54, 0x72, 0x6b,
        (track.length >>> 24) & 0xff, (track.length >>> 16) & 0xff,
        (track.length >>> 8) & 0xff, track.length & 0xff,
      ];
      const blob = new Blob([new Uint8Array([...header, ...track])], { type: 'audio/midi' });
      url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'chord-progression.mid';
      document.body.appendChild(link);
      link.click();
      link.remove();
      const downloadUrl = url;
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
      url = '';
      showHistStatus('MIDI progression exported at 120 BPM.');
    } catch (error) {
      if (url) URL.revokeObjectURL(url);
      console.error('Unable to export chord progression as MIDI.', error);
      showHistStatus('Could not export the progression as MIDI.', true);
    }
  }

  function encodeWav(audioBuffer) {
    const channelCount = audioBuffer.numberOfChannels;
    const sampleRate = audioBuffer.sampleRate;
    const frameCount = audioBuffer.length;
    const bytesPerSample = 2;
    const dataSize = frameCount * channelCount * bytesPerSample;
    const wav = new ArrayBuffer(44 + dataSize);
    const view = new DataView(wav);
    const writeText = (offset, text) => {
      for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
    };

    writeText(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeText(8, 'WAVE');
    writeText(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, channelCount, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * channelCount * bytesPerSample, true);
    view.setUint16(32, channelCount * bytesPerSample, true);
    view.setUint16(34, bytesPerSample * 8, true);
    writeText(36, 'data');
    view.setUint32(40, dataSize, true);

    const channels = Array.from({ length: channelCount }, (_, i) => audioBuffer.getChannelData(i));
    let offset = 44;
    for (let frame = 0; frame < frameCount; frame++) {
      for (let channel = 0; channel < channelCount; channel++) {
        const sample = clamp(channels[channel][frame], -1, 1);
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
        offset += bytesPerSample;
      }
    }
    return wav;
  }

  async function exportWav() {
    if (!histEntries.length) {
      showHistStatus('Play some chords before exporting.', true);
      return;
    }
    const OfflineContext = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OfflineContext) {
      showHistStatus('WAV export is not supported by this browser.', true);
      return;
    }

    try {
      const chords = histEntries.map((chord) => ({ ...chord }));
      const sampleRate = 44100;
      const secondsPerChord = 2;
      const releaseSeconds = 0.16;
      const duration = chords.length * secondsPerChord;
      const context = new OfflineContext(2, Math.ceil(duration * sampleRate), sampleRate);
      const compressor = context.createDynamicsCompressor();
      compressor.threshold.value = -6;
      compressor.knee.value = 6;
      compressor.ratio.value = 12;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.1;
      compressor.connect(context.destination);

      chords.forEach((chord, index) => {
        const start = index * secondsPerChord;
        const end = start + secondsPerChord;
        const parts = chordVoicing(chord.type, chord.inversion || 0);
        const totalWeight = parts.reduce((sum, part) => sum + part.weight, 0);

        parts.forEach((part) => {
          const oscillator = context.createOscillator();
          oscillator.type = 'sine';
          oscillator.frequency.value = 440 * Math.pow(2, (chord.midi + part.semitones - 69) / 12);
          const gain = context.createGain();
          const peak = 0.55 * 0.8 * 0.8 * part.weight / totalWeight;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.linearRampToValueAtTime(peak, start + 0.025);
          gain.gain.setValueAtTime(peak, end - releaseSeconds);
          gain.gain.exponentialRampToValueAtTime(0.0001, end);
          oscillator.connect(gain).connect(compressor);
          oscillator.start(start);
          oscillator.stop(end);
        });
      });

      const rendered = await context.startRendering();
      const wav = encodeWav(rendered);
      const url = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'chord-progression.wav';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showHistStatus('WAV progression exported at 120 BPM.');
    } catch (error) {
      console.error('Unable to render chord progression as WAV.', error);
      showHistStatus('Could not render the progression as WAV audio.', true);
    }
  }

  async function copyProgression(format) {
    if (!histEntries.length) {
      showHistStatus('Play some chords before copying.', true);
      closeCopyMenu();
      return;

    const text = progressionText(histEntries, format);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const field = document.createElement('textarea');
        field.value = text;
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        let copied;
        try {
          field.select();
          copied = document.execCommand('copy');
        } finally {
          field.remove();
        }
        if (!copied) throw new Error('The browser rejected the copy command.');
      }
      showHistStatus(format === 'degree'
        ? 'Progression copied as scale degrees.'
        : 'Progression copied as chord names.');
    } catch (error) {
      console.error('Unable to copy chord progression.', error);
      showHistStatus('Could not copy the progression to the clipboard.', true);
    }
  }

  loadArchive();

  /* ---------- pointer tracking with velocity ---------- */

  window.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    const now = performance.now();
    if (lastMoveT) {
      const dt = Math.max(1, now - lastMoveT);
      const nvx = (e.clientX - lastMoveX) / dt * 1000;
      const nvy = (e.clientY - lastMoveY) / dt * 1000;
      const a = 0.35;
      pvx += (nvx - pvx) * a;
      pvy += (nvy - pvy) * a;
    }
    lastMoveX = e.clientX;
    lastMoveY = e.clientY;
    lastMoveT = now;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
    if (rightPreview && rightPreview.pointerId === e.pointerId && (e.buttons & 2)) {
      const selection = e.clientY <= cutoffY
        ? chordAtPoint(e.clientX, e.clientY)
        : null;
      if (selection) previewRightClick(selection, e);
    }
  }, { passive: true });

  window.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('mousedown', (event) => {
    if (event.button === 0 && (event.buttons & 2) && rightPreview) {
      const activePreview = rightPreview;
      onPointerDown(event);
      if (rightPreview !== activePreview && (event.buttons & 2)) {
        const selection = event.clientY <= cutoffY
          ? chordAtPoint(event.clientX, event.clientY)
          : null;
        if (selection) {
          previewRightClick(selection, { pointerId: activePreview.pointerId });
        }
      }
    }
  });
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('mouseup', (event) => {
    if (event.button === 0 && clickPreview && clickPreview.pointerId == null) {
      finishClickPreview();
    }
  });
  window.addEventListener('pointercancel', (event) => {
    finishClickPreview(event);
    finishRightPreview(true, event);
  });
  window.addEventListener('contextmenu', (event) => {
    if (event.target && event.target.closest &&
        event.target.closest('.histbar, .mode-wheel, .mode-picker, .arrow, .piano-toggle, .note-playback-toggle, .settings-panel, .settings-toggle')) return;
    event.preventDefault();
  });

  window.addEventListener('mouseout', (e) => {
    if (!e.relatedTarget) pointer.active = false;
  });

  window.addEventListener('blur', () => {
    pointer.active = false;
    finishClickPreview();
    finishRightPreview();
  });

  /* ---------- animation loop ---------- */

  function tick(now) {
    requestAnimationFrame(tick);

    const dt = lastT ? Math.min(64, now - lastT) : 16;
    lastT = now;
    if (!modePicker.hidden) return;

    if (lastMoveT && now - lastMoveT > 60) {
      const decay = Math.exp(-dt / 120);
      pvx *= decay;
      pvy *= decay;
    }

    /* smooth per-note bubble metrics */
    const kBlob = 1 - Math.exp(-dt / 160);
    for (let i = 0; i < noteEls.length; i++) {
      const b = noteEls[i]._blob;
      if (!b) continue;
      b.x += (b.tx - b.x) * kBlob;
      b.y += (b.ty - b.y) * kBlob;
      b.r += (b.tr - b.r) * kBlob;
    }

    /* cursor point, led by velocity */
    let px = pointer.x + pvx * LEAD;
    let py = pointer.y + pvy * LEAD;
    {
      const lx = px - pointer.x, ly = py - pointer.y;
      const ll = Math.hypot(lx, ly);
      if (ll > MAX_LEAD) {
        const s = MAX_LEAD / ll;
        px = pointer.x + lx * s;
        py = pointer.y + ly * s;
      }
    }

    /* nearest + refresh measurements for the notes whose bubble we
       actually draw. This is what keeps the blob aligned while a note
       is mid-slide or mid-vertical-shift. */
    const nearAll = nearestNote(null);
    if (nearAll) measureNoteBlob(nearAll.el);
    if (latchedChord && !latchedChord.el._dying) measureNoteBlob(latchedChord.el);
    if (clickPreview && !clickPreview.el._dying) measureNoteBlob(clickPreview.el);
    if (rightPreview && !rightPreview.el._dying) measureNoteBlob(rightPreview.el);

    updateTargetSafeTop();
    computeSel();
    updatePianoIndicator();
    syncPlayingClass();
    drawTargets(dt);

    if (latchedChord || clickPreview || rightPreview || progressionPlayback) histActiveT = now;
    beginHistoryClear(now);

    /* ---------------- solid layer (latched chord) ---------------- */
    let solidTarget = 0;

    const solidChord = rightPreview && !rightPreview.el._dying
      ? rightPreview
      : clickPreview && !clickPreview.el._dying
        ? { ...latchedChord, el: clickPreview.el, handle: clickPreview.handle }
        : latchedChord && !latchedChord.el._dying ? latchedChord : null;

    if (solidChord && solidChord.el._blob && pointer.active) {
      const el = solidChord.el;
      if (!el._dying && el._blob) {
        const r  = el.getBoundingClientRect();
        let hx = r.left + r.width / 2  + el._blob.x;
        let hy = r.top  + r.height / 2 + el._blob.y;
        let hr = el._blob.r;

        /* Target chords anchor the solid blob to their drawn label. */
        const solidTargetIndex = targetIndexFor(solidChord);
        const lb = solidTargetIndex > 0 ? targetBlob(el, solidTargetIndex) : null;
        if (lb) { hx = lb.x; hy = lb.y; hr = lb.r; }

        if (!solid.init) {
          solid.x = hx; solid.y = hy; solid.r = hr;
          solid.init = true;
        } else {
          const k = 1 - Math.exp(-dt / 120);
          solid.x += (hx - solid.x) * k;
          solid.y += (hy - solid.y) * k;
          solid.r += (hr - solid.r) * k;
        }
        solidTarget = 1;
      }
    }

    solid.alpha += (solidTarget - solid.alpha) * (1 - Math.exp(-dt / 120));
    if (solid.alpha < 0.004) solid.alpha = 0;

    let solidDissolve = 0;
    if (solid.alpha > 0 && solid.init) {
      const cursor = pointer.active
        ? pointOnChordAreaRay(solid.x, solid.y, px, py)
        : { x: solid.x, y: solid.y, outsideDistance: 0 };
      solidDissolve = clamp(cursor.outsideDistance / 120, 0, 1);
      drawBlob(
        solidPath,
        solid,
        cursor.x,
        cursor.y,
        now
      );
    }
    solidPath.style.opacity = (solid.alpha * (1 - solidDissolve)).toFixed(3);
    solidPath.style.strokeDasharray = solidDissolve > 0
      ? (2 - solidDissolve).toFixed(1) + ' ' + (3 + solidDissolve * 8).toFixed(1)
      : 'none';

    /* ---------------- dashed layer (nearest chord) ---------------- */
    let dashedTarget = null;
    if (tSel.el && tSel.k > 0) {
      /* a target line is selected: the blob's chord side moves up to it
         (unless it's already the solid chord) */
      const isSolidSel = !!(solidChord &&
        tSel.el === solidChord.el && tSel.k === targetIndexFor(solidChord));
      const lb = isSolidSel ? null : targetBlob(tSel.el, tSel.k);
      if (lb) dashedTarget = { el: tSel.el, bx: lb.x, by: lb.y, r: lb.r };
    } else if (nearAll && pointer.y <= cutoffY &&
               (!solidChord || nearAll.el !== solidChord.el || targetIndexFor(solidChord) > 0)) {
      dashedTarget = nearAll;
    }

    let dashedTargetAlpha = 0;
    const dashedCursor = dashedTarget && pointer.active
      ? pointOnChordAreaRay(chord.x, chord.y, px, py)
      : null;
    if (dashedTarget && dashedCursor) {
      const pd = Math.hypot(dashedTarget.bx - dashedCursor.x, dashedTarget.by - dashedCursor.y);
      const fadeStart = interactDist * 0.85;
      dashedTargetAlpha = pd <= fadeStart
        ? 1
        : clamp((interactDist - pd) / (interactDist - fadeStart), 0, 1);
    }

    if (dashedTarget) {
      if (!chord.init || dashedAlpha < 0.02) {
        chord.x = dashedTarget.bx;
        chord.y = dashedTarget.by;
        chord.r = dashedTarget.r;
        chord.init = true;
      } else {
        const k = 1 - Math.exp(-dt / 120);
        chord.x += (dashedTarget.bx - chord.x) * k;
        chord.y += (dashedTarget.by - chord.y) * k;
        chord.r += (dashedTarget.r - chord.r) * k;
      }
      chord.el = dashedTarget.el;
    }

    dashedAlpha += (dashedTargetAlpha - dashedAlpha) * (1 - Math.exp(-dt / FADE_T));
    if (dashedAlpha < 0.004) dashedAlpha = 0;

    if (dashedAlpha > 0 && chord.init) {
      drawBlob(
        dashedPath,
        chord,
        dashedCursor ? dashedCursor.x : chord.x,
        dashedCursor ? dashedCursor.y : chord.y,
        now
      );
    }
    dashedPath.style.opacity = dashedAlpha.toFixed(3);
  }
  requestAnimationFrame(tick);

  /* ================= layout ================= */

  function layout() {
    const w = window.innerWidth;
    const modeReserve = Math.min(250, Math.max(112, w * 0.18));
    const contentWidth = w - modeReserve;
    const pad = contentWidth < 640 ? 88 : 200;
    const total = Math.max(200, Math.min(contentWidth - pad, 680));
    modeRadius = Math.min(112, Math.max(66, modeReserve * 0.45));

    document.documentElement.style.setProperty('--mode-reserve', modeReserve.toFixed(1) + 'px');
    document.documentElement.style.setProperty('--mode-radius', modeRadius.toFixed(1) + 'px');
    modeArc.setAttribute('viewBox', `0 0 ${modeRadius} ${modeRadius * 2}`);
    modeArcPath.setAttribute('d',
      `M 0 0 A ${modeRadius} ${modeRadius} 0 0 1 0 ${modeRadius * 2}`);
    updateModeWheel(false);
    updateTargetSafeTop();

    slotW    = total / (scaleCardinality + 1);
    fontSize = Math.max(scaleCardinality > 7 ? 9 : 15, Math.min(46, slotW * 0.6));
    interactDist = fontSize * 3;

    document.documentElement.style.setProperty('--slotw', slotW.toFixed(2) + 'px');
    document.documentElement.style.setProperty('--fs',    fontSize.toFixed(2) + 'px');
    notesEl.style.width = total.toFixed(2) + 'px';
    cutoffY = histBar.getBoundingClientRect().top - 6;

    for (let i = 0; i < noteEls.length; i++) {
      const el = noteEls[i];
      el.style.transform = `translateX(${(i * slotW).toFixed(2)}px)`;
      if (el._label) measureNoteBlob(el);
    }
  }

  /* ================= boot ================= */

  layout();
  rebuildScaleNotes();

  prevBtn.addEventListener('click', () => { audio(); shift(false); });
  nextBtn.addEventListener('click', () => { audio(); shift(true);  });

  modeWheel.addEventListener('pointerdown', (event) => {
    if (event.button !== undefined && event.button !== 0) return;
    const now = performance.now();
    event.preventDefault();
    const choice = event.target.closest('.mode-choice');
    modeDrag = {
      pointerId: event.pointerId,
      lastY: event.clientY,
      lastTime: now,
      distance: 0,
      speed: 0,
      moved: false,
      choiceIndex: choice ? Number(choice.dataset.mode) : null,
    };
    modeWheel.classList.add('dragging');
    modeWheel.setPointerCapture(event.pointerId);
  });
  modeWheel.addEventListener('pointermove', (event) => {
    if (!modeDrag || modeDrag.pointerId !== event.pointerId) return;
    const delta = event.clientY - modeDrag.lastY;
    const now = performance.now();
    const elapsed = Math.max(1, now - modeDrag.lastTime);
    modeDrag.lastY = event.clientY;
    modeDrag.lastTime = now;
    const speedPerFrame = Math.abs(delta) / elapsed * 16;
    modeDrag.speed = modeDrag.speed * 0.65 + speedPerFrame * 0.35;

    if (delta && modeDrag.distance && Math.sign(delta) !== Math.sign(modeDrag.distance)) {
      modeDrag.distance = 0;
    }
    modeDrag.distance += delta;
    const threshold = Math.min(
      MODE_DRAG_MAX_STEP,
      MODE_DRAG_STEP * (1 + modeDrag.speed / MODE_DRAG_SPEED_SCALE)
    );
    if (Math.abs(modeDrag.distance) >= threshold) {
      const direction = modeDrag.distance < 0 ? -1 : 1;
      modeDrag.distance -= Math.sign(modeDrag.distance) * threshold;
      modeDrag.moved = true;
      selectMode(modeIdx + direction);
    }
  });
  function finishModeDrag(event) {
    if (!modeDrag || (event && modeDrag.pointerId !== event.pointerId)) return;
    if (modeDrag.moved) {
      lastModePointerPress = null;
    } else if (event && event.type === 'pointerup') {
      const now = performance.now();
      const isDoublePress = lastModePointerPress &&
        now - lastModePointerPress.time < 750 &&
        Math.hypot(
          event.clientX - lastModePointerPress.x,
          event.clientY - lastModePointerPress.y
        ) < 24;
      if (isDoublePress) {
        lastModePointerPress = null;
        ignoreModeClickUntil = now + 500;
        openModePicker();
      } else {
        lastModePointerPress = { time: now, x: event.clientX, y: event.clientY };
        if (modeDrag.choiceIndex !== null) selectMode(modeDrag.choiceIndex);
      }
    }
    suppressModeClick = modeDrag.moved;
    if (suppressModeClick) setTimeout(() => { suppressModeClick = false; }, 0);
    modeDrag = null;
    modeWheel.classList.remove('dragging');
  }
  modeWheel.addEventListener('pointerup', finishModeDrag);
  modeWheel.addEventListener('pointercancel', finishModeDrag);
  modeWheel.addEventListener('lostpointercapture', finishModeDrag);
  modeWheel.addEventListener('click', (event) => {
    if (event.detail >= 2) {
      event.preventDefault();
      openModePicker();
      ignoreModeClickUntil = 0;
      return;
    }
    if (performance.now() < ignoreModeClickUntil) {
      ignoreModeClickUntil = 0;
      event.preventDefault();
      return;
    }
    if (suppressModeClick) {
      suppressModeClick = false;
      event.preventDefault();
      return;
    }
    const choice = event.target.closest('.mode-choice');
    if (choice) selectMode(Number(choice.dataset.mode));
  });
  document.addEventListener('dblclick', (event) => {
    const bounds = modeWheel.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom) return;
    event.preventDefault();
    openModePicker();
  }, true);
  modeSetPrevious.addEventListener('click', () => cyclePickerFamily(-1));
  modeSetNext.addEventListener('click', () => cyclePickerFamily(1));
  modeSetDisplay.addEventListener('pointerdown', (event) => {
    const interval = event.target.closest('.mode-set-step');
    if (!interval || event.button !== 0) return;
    const family = MODE_FAMILY_BY_ID.get(pickerFamilyId);
    if (!family) return;
    const initialSteps = pickerSteps.slice();
    modeSetDrag = {
      pointerId: event.pointerId,
      initialSteps,
      initialPresetModeName: pickerPresetModeName,
      steps: initialSteps.slice(),
      currentIndex: Number(interval.dataset.index),
      lastX: event.clientX,
    };
    modeSetDisplay.setPointerCapture(event.pointerId);
    modeSetDisplay.classList.add('dragging');
    event.preventDefault();
  });
  modeSetDisplay.addEventListener('pointermove', (event) => {
    if (!modeSetDrag || modeSetDrag.pointerId !== event.pointerId) return;
    const bounds = modeSetDisplay.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom) return;

    const intervals = Array.from(modeSetDisplay.querySelectorAll('.mode-set-step'));
    const currentIndex = modeSetDrag.currentIndex;
    const pointerDelta = event.clientX - modeSetDrag.lastX;
    modeSetDrag.lastX = event.clientX;
    if (!pointerDelta) return;
    const currentBounds = intervals[currentIndex].getBoundingClientRect();
    const hysteresis = Math.max(6, modeSetDisplay.clientWidth * 0.01);
    let nextIndex = currentIndex;

    if (pointerDelta > 0 && currentIndex < intervals.length - 1) {
      const nextBounds = intervals[currentIndex + 1].getBoundingClientRect();
      const boundary = (currentBounds.right + nextBounds.left) / 2;
      if (event.clientX > boundary + hysteresis) nextIndex++;
    } else if (pointerDelta < 0 && currentIndex > 0) {
      const previousBounds = intervals[currentIndex - 1].getBoundingClientRect();
      const boundary = (previousBounds.right + currentBounds.left) / 2;
      if (event.clientX < boundary - hysteresis) nextIndex--;
    }
    if (nextIndex === currentIndex) return;

    const [step] = modeSetDrag.steps.splice(currentIndex, 1);
    modeSetDrag.steps.splice(nextIndex, 0, step);
    modeSetDrag.currentIndex = nextIndex;
    pickerPresetModeName = null;
    const changedIndexes = new Set();
    for (let index = Math.min(currentIndex, nextIndex);
      index <= Math.max(currentIndex, nextIndex);
      index++) changedIndexes.add(index);
    modeSetDisplay.setAttribute(
      'aria-label',
      `Reordering set: ${intervalPatternLabel(modeSetDrag.steps)}`,
    );
    renderModeSetSteps(modeSetDrag.steps, changedIndexes);
  });
  function finishModeSetDrag(event, commit) {
    if (!modeSetDrag || modeSetDrag.pointerId !== event.pointerId) return;
    const drag = modeSetDrag;
    modeSetDrag = null;
    modeSetDisplay.classList.remove('dragging');
    const bounds = modeSetDisplay.getBoundingClientRect();
    const releasedInside = event.clientX >= bounds.left && event.clientX <= bounds.right &&
      event.clientY >= bounds.top && event.clientY <= bounds.bottom;
    const familyId = canonicalSteps(drag.steps).join(',');
    const family = MODE_FAMILY_BY_ID.get(familyId);
    if (commit && releasedInside && family &&
        family.distributionKey === pickerDistributionKey) {
      pickerFamilyId = family.id;
      pickerSteps = drag.steps;
      updateModeSetDisplay(family, pickerSteps);
    } else {
      const selectedFamily = MODE_FAMILY_BY_ID.get(pickerFamilyId);
      if (selectedFamily) {
        pickerSteps = drag.initialSteps;
        pickerPresetModeName = drag.initialPresetModeName;
        updateModeSetDisplay(selectedFamily, pickerSteps, pickerPresetModeName);
      }
    }
  }
  modeSetDisplay.addEventListener('pointerup', (event) => finishModeSetDrag(event, true));
  modeSetDisplay.addEventListener('pointercancel', (event) => finishModeSetDrag(event, false));
  modeSetDisplay.addEventListener('lostpointercapture', (event) =>
    finishModeSetDrag(event, false));
  function onDistributionSelect(event) {
    if (event.type !== 'click') {
      const target = event.target.closest('[data-distribution]');
      if (target) choosePickerDistribution(target.dataset.distribution);
      return;
    }

    let closestDistribution = null;
    let closestDistance = 24;
    modeFamilyChart.querySelectorAll('.mode-family-hit').forEach((curve) => {
      const length = curve.getTotalLength();
      const samples = Math.max(100, Math.ceil(length / 2));
      const screenTransform = curve.getScreenCTM();
      if (!screenTransform) return;
      const { a, b, c, d, e, f } = screenTransform;
      for (let index = 0; index <= samples; index++) {
        const point = curve.getPointAtLength(length * index / samples);
        const dx = a * point.x + c * point.y + e - event.clientX;
        const dy = b * point.x + d * point.y + f - event.clientY;
        const distance = Math.hypot(dx, dy);
        if (distance < closestDistance) {
          closestDistance = distance;
          closestDistribution = curve.dataset.distribution;
        }
      }
    });
    if (closestDistribution) choosePickerDistribution(closestDistribution);
  }
  modeFamilyChart.addEventListener('click', onDistributionSelect);
  modeFamilyChart.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    onDistributionSelect(event);
  });
  modeCardinalityPrevious.addEventListener('click', () => changePickerCardinality(-1));
  modeCardinalityNext.addEventListener('click', () => changePickerCardinality(1));
  populateNamedScalePresets();
  modePickerPresetsToggle.addEventListener('click', () => {
    const shouldOpen = modePickerPresets.hidden;
    modePickerPresets.hidden = !shouldOpen;
    modePickerPresetsToggle.setAttribute('aria-expanded', String(shouldOpen));
    if (shouldOpen) modePickerPresets.querySelector('button')?.focus();
  });
  modePickerCancel.addEventListener('click', closeModePicker);
  modePickerApply.addEventListener('click', applyModeFamily);
  document.addEventListener('pointerdown', (event) => {
    if (!modePickerPresets.hidden && !modePickerPresetsControl.contains(event.target)) {
      modePickerPresets.hidden = true;
      modePickerPresetsToggle.setAttribute('aria-expanded', 'false');
    }
    if (!modePicker.hidden && !modePicker.contains(event.target) &&
        !modeWheel.contains(event.target)) {
      closeModePicker();
    }
  });
  window.addEventListener('keydown', (event) => {
    if (modePicker.hidden || event.key !== 'Escape') return;
    event.preventDefault();
    if (!modePickerPresets.hidden) {
      modePickerPresets.hidden = true;
      modePickerPresetsToggle.setAttribute('aria-expanded', 'false');
      modePickerPresetsToggle.focus();
      return;
    }
    closeModePicker();
  });
  modeWheel.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
      event.preventDefault();
      selectMode(modeIdx + (event.key === 'ArrowUp' ? 1 : -1));
    }
  });

  window.addEventListener('keydown', (e) => {
    if (!modePicker.hidden) return;
    if (e.defaultPrevented) return;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); audio(); shift(false); }
    if (e.key === 'ArrowRight') { e.preventDefault(); audio(); shift(true);  }
  });

  function inversionDigit(event) {
    const match = /^(?:Digit|Numpad)([1-3])$/.exec(event.code);
    if (match) return match[1];
    return /^[1-3]$/.test(event.key) ? event.key : null;
  }

  window.addEventListener('keydown', (event) => {
    if (!modePicker.hidden) return;
    const digit = inversionDigit(event);
    if (!digit || event.repeat) return;
    const target = event.target;
    if (target && target.closest &&
        target.closest('input, textarea, select, [contenteditable="true"]')) return;
    heldInversionKeys.delete(digit);
    heldInversionKeys.add(digit);
    updateInversionIndicator();
    updateRightPreviewInversion();
  });
  window.addEventListener('keyup', (event) => {
    if (!modePicker.hidden) return;
    const digit = inversionDigit(event);
    if (!digit || !heldInversionKeys.has(digit)) return;
    heldInversionKeys.delete(digit);
    updateInversionIndicator();
    updateRightPreviewInversion();
  });
  window.addEventListener('blur', () => {
    heldInversionKeys.clear();
    updateInversionIndicator();
    updateRightPreviewInversion();
  });

  window.addEventListener('resize', layout);
})();
</script>
</body>
</html>
